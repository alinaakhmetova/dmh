<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMH Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--brand:#4D1774;--brand-dark:#2E0D45;--accent:#F65925;--paper:#EEECF4;--card:#fff;--ink:#2E0D45;--ink-soft:#7A6690;--line:#DDD5E8;--brand-soft:#F1E9F7;--accent-soft:#FDE7DE;--slate:#F4F2F8;--ok:#1a7f4b;--ok-soft:#e3f4ea;--warn:#b45309;--warn-soft:#fdf0dc;--bad:#b42318;}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.45 'IBM Plex Sans',system-ui,sans-serif;}
button,input,select,textarea{font:inherit;color:inherit;}
.top{display:flex;align-items:center;gap:22px;padding:10px 22px;background:var(--brand-dark);color:#fff;position:sticky;top:0;z-index:20;}
.logo{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#d9c8ea;white-space:nowrap;}
.top nav{display:flex;gap:4px;} .top nav button{background:none;border:0;color:#d9c8ea;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;}
.top nav button.on{background:rgba(255,255,255,.14);color:#fff;} .top nav button:hover{background:rgba(255,255,255,.08);}
.badge{background:var(--accent);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:5px;}
#saveInd{margin-left:auto;font-size:12px;color:#d9c8ea;white-space:nowrap;} #saveInd.ok{color:#9be3bb;} #saveInd.warn{color:#ffd9a0;} #saveInd.bad{color:#ffb4a8;font-weight:600;} #saveInd a{color:#fff;text-decoration:underline;cursor:pointer;margin-left:6px;} #status{font-size:12px;color:#d9c8ea;} #status.err{color:#ffb4a8;}
.demo{background:var(--accent-soft);color:#7a2c10;padding:7px 22px;font-size:12px;border-bottom:1px solid #f3c9b6;}
main{padding:18px 22px 60px;max-width:1700px;margin:0 auto;}
h1{font:600 22px 'Fraunces',serif;margin:0 0 4px;} h2{font:600 15px 'Fraunces',serif;margin:0 0 10px;color:var(--brand);}
.sub{color:var(--ink-soft);margin:0 0 14px;}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.bar input[type=search],.bar select{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:#fff;}
.bar input[type=search]{min-width:200px;}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink-soft);}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:7px;padding:7px 13px;font-weight:600;cursor:pointer;}
.btn.sec{background:#fff;color:var(--brand);} .btn.sm{padding:4px 9px;font-size:12px;} .btn.ghost{border-color:transparent;background:none;color:var(--brand);}
.btn.bad{color:var(--bad);border-color:#f0b4ae;background:#fff;}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 190px);}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:1280px;}
.grid th{position:sticky;top:0;background:#fbf9fd;z-index:2;text-align:left;font:600 10.5px 'IBM Plex Sans';letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.grid th.grp{top:0;color:var(--brand);border-bottom:0;padding-bottom:0;} .grid th.grp select{font:600 11px 'IBM Plex Sans';border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:#fff;color:var(--brand);}
.grid td{padding:7px 10px;border-bottom:1px solid #eee9f3;vertical-align:middle;white-space:nowrap;}
.grid tbody tr:hover{background:#faf7fd;} .grid td.mid{border-left:1px solid var(--line);}
.grid tfoot td{position:sticky;bottom:0;background:#fbf9fd;font-weight:600;border-top:1px solid var(--line);}
.grid td{padding:6px 8px;} .grid th{padding:9px 8px;} .grid th.num{text-align:right;}
input.cell,.ro{width:84px;box-sizing:border-box;} .ro{padding:4px 6px;border:1px solid transparent;} .share{display:inline-block;width:34px;text-align:left;} .chip{padding:2px 6px;font-size:10.5px;}
.grid .stk1{position:sticky;left:0;z-index:1;background:#fff;min-width:74px;max-width:74px;} .grid th.stk1{background:#fbf9fd;z-index:3;}
.grid .stk2{position:sticky;left:74px;z-index:1;background:#fff;box-shadow:1px 0 0 var(--line);min-width:170px;} .grid .stk2.solo{left:0;} .grid th.stk2{background:#fbf9fd;z-index:3;}
.grid tbody tr:hover .stk1,.grid tbody tr:hover .stk2{background:#faf7fd;} .grid tfoot .stk1,.grid tfoot .stk2{background:#fbf9fd;}
.grid td.wrap{white-space:normal;min-width:210px;max-width:270px;} .nt{font-size:12px;line-height:1.3;padding:1px 0;}
.menu{position:absolute;right:0;top:38px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:30;display:flex;flex-direction:column;gap:7px;min-width:170px;} .menu[hidden]{display:none;} .menu .chk{color:var(--ink);}
.id{font:12px 'IBM Plex Mono',monospace;color:var(--ink-soft);}
a.hname{font-weight:600;color:var(--brand);cursor:pointer;text-decoration:none;} a.hname:hover{text-decoration:underline;}
input.cell{width:84px;border:1px solid transparent;border-radius:6px;padding:4px 6px;text-align:right;background:transparent;}
input.cell:hover{border-color:var(--line);background:#fff;} input.cell:focus{outline:2px solid var(--brand);background:#fff;}
.ro{display:inline-block;min-width:84px;text-align:right;padding:4px 6px;color:var(--ink-soft);cursor:pointer;} .num{text-align:right;}
.muted{color:var(--ink-soft);} .sm{font-size:11.5px;}
.chips{display:flex;gap:4px;flex-wrap:wrap;} .chips.nw{flex-wrap:nowrap;}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;font-size:11px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);}
.chip i{width:7px;height:7px;border-radius:50%;background:#ccc;display:inline-block;}
.chip.live{background:var(--ok-soft);border-color:#bfe3cf;color:var(--ok);} .chip.live i{background:var(--ok);}
.chip.planned{background:var(--warn-soft);border-color:#f1d6a6;color:var(--warn);} .chip.planned i{background:#e59a2b;}
.chip.paused{background:#eee;color:#777;} .chip.off{opacity:.55;border-style:dashed;} button.chip{cursor:pointer;}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;background:var(--brand-soft);color:var(--brand);}
.pill.warn{background:var(--warn-soft);color:var(--warn);} .pill.ok{background:var(--ok-soft);color:var(--ok);} .pill.bad{background:#fde8e6;color:var(--bad);}
select.mini{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;font-size:12px;}
.cols{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start;} @media(max-width:1000px){.cols{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;} .fields .full{grid-column:1/-1;}
.fields label{display:block;font:600 10px 'IBM Plex Sans';letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px;}
.fields input,.fields select,.fields textarea,.inp{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;}
.todo{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #f0ecf5;} .todo.done span{text-decoration:line-through;color:var(--ink-soft);}
.todo span{flex:1;} .due{font-size:11px;color:var(--ink-soft);} .due.late{color:var(--bad);font-weight:600;}
.addrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;} .addrow #tdText{flex:1 1 100%;} .addrow input{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 8px;}
.work{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:8px;background:#fff;}
.work .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;} .work .head input.t{flex:1;min-width:180px;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-weight:600;}
.work .head input.t:hover,.work .head input.t:focus{border-color:var(--line);outline:none;}
.work .body{margin-top:8px;display:none;} .work.open .body{display:block;} .work textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;} .thumbs .th{position:relative;} .thumbs img{height:76px;border:1px solid var(--line);border-radius:6px;display:block;background:#fff;}
.thumbs .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:11px;line-height:16px;padding:0;}
.grp-title{font:600 11px 'IBM Plex Sans';letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:12px 0 6px;}
table.mini{width:100%;border-collapse:collapse;} .mini th{font:600 10.5px 'IBM Plex Sans';text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);} .mini th:first-child,.mini td:first-child{text-align:left;}
.mini td{padding:6px 8px;border-bottom:1px solid #f0ecf5;text-align:right;white-space:nowrap;} .mini tr:hover{background:#faf7fd;}
.modal{position:fixed;inset:0;background:rgba(46,13,69,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;} .modal[hidden]{display:none;}
.sheet{background:#fff;border-radius:12px;max-width:860px;width:100%;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.sheet h2{font-size:17px;} .sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.camp{width:100%;border-collapse:collapse;margin-top:6px;} .camp th{font:600 10.5px 'IBM Plex Sans';text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:4px 4px;} .camp td{padding:3px 3px;} .camp input{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 6px;}
.empty{padding:26px;text-align:center;color:var(--ink-soft);}
.feehint{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
@media print{.top,.bar{display:none;}}
</style>
</head>
<body>
<header class="top"><div class="logo">EXELY · DMH </div>
<nav id="tabs"><button data-act="tab" data-t="hotels" class="on">Hotels</button><button data-act="tab" data-t="todo">Notes<span class="badge" id="todoBadge" hidden></span></button><button data-act="tab" data-t="settings">Settings</button></nav>
<div id="saveInd"></div><div id="status"></div></header>
<div id="demoBanner" class="demo" hidden>Demo data (not saved anywhere). The hub reads your real hotels, results and activities from the same Google Sheet as the other DMH tools.</div>
<main id="app"><div class="empty">Loading…</div></main>
<div id="modal" class="modal" hidden></div>
<script>
/* =============== backend (same Google Sheet as the other DMH tools) =============== */
const KEY_URL = "dmh-sheets-url";
let SHEETS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxKHZNNI6QlVeyv9Q982-ErEYSXkIdD6vTt0Lpq5z2YMCA_-cR1KROjWjM_p_tzolDSVw/exec";
(function remember(){
  try{
    const ok = u => /^https:\/\/script\.google\.com\//.test(String(u||"").trim());
    if(ok(SHEETS_WEBAPP_URL)){ localStorage.setItem(KEY_URL, SHEETS_WEBAPP_URL.trim()); return; }
    if(SHEETS_WEBAPP_URL.indexOf("PASTE_YOUR") !== 0) return;
    let s = localStorage.getItem(KEY_URL);
    if(!ok(s)){ const v = typeof prompt === "function" ? prompt("Paste your Apps Script web app URL (the same one the other DMH tools use). It is remembered in this browser.") : ""; s = ok(v) ? v.trim() : ""; if(s) localStorage.setItem(KEY_URL, s); }
    if(s) SHEETS_WEBAPP_URL = s;
  }catch(e){}
})();
const withTimeout = (p, ms, label) => Promise.race([p, new Promise((_, rej)=>setTimeout(()=>rej(new Error("timeout: " + label)), ms))]);
function backendOk(){ if(SHEETS_WEBAPP_URL.indexOf("PASTE_YOUR") === 0) throw new Error("Backend URL is not set — open Settings and paste it."); }
async function stGet(key){ backendOk(); const r = await withTimeout(fetch(`${SHEETS_WEBAPP_URL}?key=${encodeURIComponent(key)}&_=${Date.now()}`, {cache:"no-store"}), 12000, key); const d = await r.json(); if(d.error) throw new Error(d.error); return d.value; }
async function stGetBulk(keys){
  backendOk(); const out = {};
  for(let i = 0; i < keys.length; i += 24){
    const part = keys.slice(i, i + 24);
    try{ const r = await withTimeout(fetch(`${SHEETS_WEBAPP_URL}?keys=${encodeURIComponent(part.join(","))}&_=${Date.now()}`, {cache:"no-store"}), 25000, "loading"); const d = await r.json(); if(d && d.values){ Object.assign(out, d.values); continue; } }catch(e){}
    await Promise.all(part.map(async k=>{ try{ out[k] = await stGet(k); }catch(e){} }));
  }
  return out;
}
async function stSet(key, value){ backendOk(); const r = await withTimeout(fetch(SHEETS_WEBAPP_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, cache:"no-store", body:JSON.stringify({action:"set", key, value})}), 20000, "saving " + key); return r.json(); }
async function stDel(key){ backendOk(); const r = await withTimeout(fetch(SHEETS_WEBAPP_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, cache:"no-store", body:JSON.stringify({action:"delete", key})}), 20000, "deleting " + key); return r.json(); }
async function stList(prefix){ backendOk(); try{ const r = await withTimeout(fetch(`${SHEETS_WEBAPP_URL}?list=1&prefix=${encodeURIComponent(prefix)}&_=${Date.now()}`, {cache:"no-store"}), 15000, "listing"); const d = await r.json(); return d.keys || []; }catch(e){ return []; } }
const jget = async k => { try{ const v = await stGet(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } };
const parse = v => { try{ return v ? JSON.parse(v) : null; }catch(e){ return null; } };

/* images: compressed, stored in ~40k chunks (same scheme as the report tool) */
const CHUNK = 40000, imgCache = {};
async function storeImage(url){ const id = "im" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); const n = Math.ceil(url.length / CHUNK); for(let i = 0; i < n; i++) await stSet(`dmh-img:${id}:c${i}`, "~" + url.slice(i * CHUNK, (i + 1) * CHUNK)); await stSet(`dmh-img:${id}`, JSON.stringify({n, len:url.length})); imgCache[id] = url; return id; }
async function fetchImage(id){ if(imgCache[id]) return imgCache[id]; const meta = JSON.parse(await stGet(`dmh-img:${id}`)); const keys = Array.from({length:meta.n}, (_, i)=>`dmh-img:${id}:c${i}`); const parts = await stGetBulk(keys); const url = keys.map(k=>String(parts[k]).replace(/^~/, "")).join(""); imgCache[id] = url; return url; }
function hydrate(root){ root.querySelectorAll("img[data-imgid]").forEach(img=>fetchImage(img.dataset.imgid).then(u=>{ img.src = u; }).catch(()=>{ img.alt = "image unavailable"; })); }
async function compressImage(file){
  const bmp = await createImageBitmap(file); let scale = Math.min(1, 1000 / bmp.width), q = .8, out = "";
  for(let a = 0; a < 7; a++){ const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale); const c = document.createElement("canvas"); c.width = w; c.height = h; const cx = c.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h); cx.drawImage(bmp, 0, 0, w, h); out = c.toDataURL("image/jpeg", q); if(out.length <= 140000) break; if(q > .5) q -= .1; else scale *= .85; }
  return out;
}

/* =============== small helpers =============== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(/[\s,\u00a0$]/g, "")); return isNaN(n) ? 0 : n; };
const has = v => v !== undefined && v !== null && String(v).trim() !== "";
const money = v => has(v) ? "$" + Math.round(num(v)).toLocaleString("en-US") : "—";
const intf = v => has(v) ? Math.round(num(v)).toLocaleString("en-US") : "—";
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function parsePeriod(l){
  const t = String(l || "").trim(); let n = t.match(/^(\d{4})[-/.](\d{1,2})$/), n2 = t.match(/^(\d{1,2})[-/.](\d{4})$/);
  if(n || n2){ const y = +(n ? n[1] : n2[2]), m = +(n ? n[2] : n2[1]); return m >= 1 && m <= 12 ? new Date(y, m - 1, 1).getTime() : null; }
  const m = t.match(/^([A-Za-z]{3,9})\.?,?\s+(\d{4})$/); if(!m) return null;
  const i = MONTHS.findIndex(x=>x.slice(0, 3).toLowerCase() === m[1].slice(0, 3).toLowerCase()); return i < 0 ? null : new Date(+m[2], i, 1).getTime();
}
const labelOf = t => { const d = new Date(t); return MONTHS[d.getMonth()] + " " + d.getFullYear(); };
const samePeriod = (a, b) => { const x = String(a || "").trim().toLowerCase(), y = String(b || "").trim().toLowerCase(); if(!x || !y) return false; if(x === y) return true; const p = parsePeriod(a), q = parsePeriod(b); return p !== null && p === q; };
const nextMonth = l => { const t = parsePeriod(l); if(t === null) return l; const d = new Date(t); d.setMonth(d.getMonth() + 1); return labelOf(d.getTime()); };
const sumRows = (rows, k) => (rows || []).reduce((a, r)=>a + num(r[k]), 0);
function say(msg, err){ const s = $("status"); s.textContent = msg || ""; s.className = err ? "err" : ""; if(msg && !err) setTimeout(()=>{ if(s.textContent === msg) s.textContent = ""; }, 2500); }
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

/* =============== config, state =============== */
const DEFAULT_CHANNELS = [
  {k:"search", n:"Google Search", s:"Search"}, {k:"hotelads", n:"Google Hotel Ads", s:"Hotel Ads"}, {k:"pmax", n:"Performance Max", s:"PMax"},
  {k:"meta", n:"Meta Ads", s:"Meta"}, {k:"tiktok", n:"TikTok Ads", s:"TikTok"}, {k:"msads", n:"Microsoft Ads", s:"MS Ads"}, {k:"yandex", n:"Yandex Ads", s:"Yandex"},
  {k:"seo", n:"SEO & website", s:"SEO"}, {k:"gbp", n:"Google Business Profile", s:"GBP"}, {k:"gfl", n:"Free Booking Links", s:"GFL"}, {k:"crm", n:"Email / CRM", s:"CRM"}];
const DEFAULT_AREAS = [{n:"Website", g:"Website"}, {n:"SEO", g:"Website"}, {n:"Content", g:"Website"}, {n:"Advertising", g:"Advertising"}, {n:"Other", g:"Website"}];
let CFG = {channels:DEFAULT_CHANNELS, areas:DEFAULT_AREAS, reportUrl:"dmh_hotel_report.html"};
const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9а-яё]+/g, "");
let hotels = [];
const COLS = [{k:"id", n:"ID"}, {k:"hotel", n:"Hotel", fixed:true}, {k:"tariff", n:"Tariff"}, {k:"csm", n:"CSM"}, {k:"channels", n:"Channels"}, {k:"notes", n:"Notes"},
  {k:"rev", n:"Revenue", num:1, m:1}, {k:"bk", n:"Bookings", num:1, m:1}, {k:"pbk", n:"Paid bookings", num:1, m:1}, {k:"prev", n:"Paid revenue", num:1, m:1}, {k:"spend", n:"Ad spend", num:1, m:1}, {k:"fee", n:"Our fee", num:1, m:1}, {k:"rep", n:"Report", m:1}];
const hiddenCols = () => { try{ return new Set(JSON.parse(localStorage.getItem("dmh-hub-cols") || "[]")); }catch(e){ return new Set(); } };
const state = {draftAdd:false, tab:"hotels", hotel:null, month:null, f:{q:"", country:"", todo:false}, showDone:false, openWork:{}, openTd:{}};
const byId = id => hotels.find(h=>h.id === id);
const F = (h, k) => h.rec.sections.hotelData.fields[k] || "";
const blankPeriod = label => ({period:label, rows:[], seasonalNote:"", visibilityMetrics:[], totalWebsiteTraffic:"", totalBeTraffic:"", totalBookings:"", totalRevenue:"", yoyRevenue:"", yoyTraffic:"", yoyBookings:"", yoyForm:"", channels:[], gsc:{clicks:"", impressions:"", ctr:"", position:"", days:""}});

function normalize(h){
  h.rec = h.rec || {id:h.id, sections:{}}; h.rec.sections = h.rec.sections || {};
  const hd = h.rec.sections.hotelData = h.rec.sections.hotelData || {fields:{}, tables:{}, tags:{}}; hd.fields = hd.fields || {};
  const hub = h.rec.hub = h.rec.hub || {};
  hub.channels = hub.channels || {}; hub.todo = hub.todo || []; hub.reports = hub.reports || {};
  h.results = h.results && Array.isArray(h.results.periods) ? h.results : {periods:[]};
  h.progress = h.progress && Array.isArray(h.progress.cards) ? h.progress : {cards:[], ideas:[], generalNotes:[]};
}
async function loadAll(){
  say("Loading…");
  const idx = (await jget("dmh-hotel-index")) || [];
  const cfg = await jget("dmh-hub-config"); if(cfg) CFG = Object.assign({}, CFG, cfg); if(!Array.isArray(CFG.areas) || !CFG.areas.length) CFG.areas = DEFAULT_AREAS.slice();
  const keys = []; idx.forEach(h=>keys.push(`dmh-hotel:${h.id}`, `dmh-results:${h.id}`, `dmh-progress:${h.id}`));
  const v = await stGetBulk(keys);
  hotels = idx.map(h=>({id:h.id, rec:parse(v[`dmh-hotel:${h.id}`]) || {id:h.id, sections:{hotelData:{fields:{name:h.name}}}}, results:parse(v[`dmh-results:${h.id}`]), progress:parse(v[`dmh-progress:${h.id}`])}));
  hotels.forEach(normalize);
  hotels.sort((a, b)=>F(a, "name").localeCompare(F(b, "name")));
  const ms = allMonths(); state.month = state.month || ms.find(m=>hotels.some(h=>periodOf(h, m))) || ms[0];

}
function allMonths(){
  const set = new Map(); hotels.forEach(h=>h.results.periods.forEach(p=>{ const t = parsePeriod(p.period); if(t !== null) set.set(t, labelOf(t)); }));
  const now = new Date(); const cur = new Date(now.getFullYear(), now.getMonth(), 1).getTime(); set.set(cur, labelOf(cur));
  return [...set.entries()].sort((a, b)=>b[0] - a[0]).map(x=>x[1]);
}
const periodOf = (h, l) => h.results.periods.find(p=>samePeriod(p.period, l));
function snap(h, l){
  const p = periodOf(h, l); if(!p) return null; const rows = p.rows || [];
  return {p, rev:p.totalRevenue, bk:p.totalBookings, form:p.totalBeTraffic, sess:p.totalWebsiteTraffic, rows, paidBk:sumRows(rows, "bookings"), paidRev:sumRows(rows, "revenue"), spend:sumRows(rows, "spend")};
}
// The hotel's Exely number (the one that sits in its name, e.g. "Astoria Tbilisi 504673") is a separate field; the technical key (HTL-…) stays hidden.
const tail = n => { const m = String(n || "").match(/^(.*?)[\s\-–—·]*(\d{3,})\s*$/); return m ? {base:m[1].trim(), num:m[2]} : null; };
const exId = h => h.rec.hub.num || (tail(F(h, "name")) || {}).num || "";
const dispName = h => { const t = tail(F(h, "name")); return (t && t.base && (!h.rec.hub.num || h.rec.hub.num === t.num)) ? t.base : (F(h, "name") || "Hotel"); };
const country = h => h.rec.hub.country || String(F(h, "location")).split(",").pop().trim();
function tariff(h){
  const f = h.rec.hub.fee; if(f && f.type) return f;
  const m = String(F(h, "modelType")), p = m.match(/(\d+(?:[.,]\d+)?)\s*%/);
  return p ? {type:/track/i.test(m) ? "tracked" : "all", pct:parseFloat(p[1].replace(",", ".")), derived:true} : null;
}
const tariffLabel = h => { const t = tariff(h); if(!t || !t.type) return F(h, "modelType") || "—"; if(t.type !== "fixed" && !has(t.pct)) return "— set %"; return t.type === "fixed" ? `$${intf(t.fixed)}/mo fixed` : `${t.pct}% of ${t.type === "tracked" ? "tracked" : "all"}`; };
function feeOf(h, s){ const t = tariff(h); if(!t || !t.type || !s) return null; if(t.type === "fixed") return has(t.fixed) ? num(t.fixed) : null; if(!has(t.pct)) return null; const base = t.type === "tracked" ? s.paidRev : num(s.rev); return (t.type === "tracked" ? s.rows.length : has(s.rev)) ? base * num(t.pct) / 100 : null; }

/* ---- saving: always read the latest record first, change only what we touch ---- */
const chains = new Map(), qlen = new Map();
const enqueue = (key, job) => { qlen.set(key, (qlen.get(key) || 0) + 1); const prev = chains.get(key) || Promise.resolve(); const next = prev.catch(()=>{}).then(job).finally(()=>qlen.set(key, qlen.get(key) - 1)); chains.set(key, next); return next; };
const idle = key => !(qlen.get(key) > 0);
async function mutate(key, fallback, fn){ return enqueue(key, async ()=>{ let latest = await jget(key); if(!latest) latest = fallback; fn(latest); await stSet(key, JSON.stringify(latest)); return latest; }); }
async function mutateResults(h, label, fn){ h.results = await mutate(`dmh-results:${h.id}`, h.results, r=>{ r.periods = r.periods || []; let p = r.periods.find(x=>samePeriod(x.period, label)); if(!p){ p = blankPeriod(labelOf(parsePeriod(label))); r.periods.push(p); } fn(p); }); normalize(h); }
async function mutateRecord(h, fn){
  const key = `dmh-hotel:${h.id}`, before = JSON.parse(JSON.stringify(h.rec)), apply = r=>{ r.sections = r.sections || {}; r.sections.hotelData = r.sections.hotelData || {fields:{}}; r.hub = r.hub || {}; fn(r); };
  apply(h.rec); normalize(h);                                              // the change is visible at once…
  const latest = await mutate(key, before, apply);                        // …and written after the previous writes, on top of the latest saved version
  if(idle(key)){ h.rec = latest; normalize(h); }                          // only the last write may replace what is on screen
}
async function mutateProgress(h, fn){ h.progress = await mutate(`dmh-progress:${h.id}`, h.progress, p=>{ p.cards = p.cards || []; fn(p); }); normalize(h); }
const sv = {pending:0, dirty:0, last:"", err:"", retry:null}, timers = new Map();
const nowT = () => new Date().toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
function paintSave(){
  const el = $("saveInd"); if(!el) return; let t = "", c = "";
  if(sv.err){ t = `⚠ Not saved — ${esc(sv.err)} <a data-act="retrysave">Retry</a>`; c = "bad"; }
  else if(sv.pending){ t = "Saving…"; }
  else if(sv.dirty){ t = "Unsaved changes…"; c = "warn"; }
  else if(state.draftAdd){ t = "✎ Not added yet — press Enter or click Add"; c = "warn"; }
  else if(sv.last){ t = `✓ All changes saved ${sv.last}`; c = "ok"; }
  el.className = c; el.innerHTML = t;
}
async function guard(fn){
  sv.pending++; paintSave();
  try{ await fn(); sv.err = ""; sv.last = nowT(); sv.retry = null; }
  catch(e){ sv.err = e.message; sv.retry = fn; }
  finally{ sv.pending--; paintSave(); }
}
function schedule(t){   // typing: save about a second after the last keystroke, without waiting for the field to lose focus
  if(timers.has(t)) clearTimeout(timers.get(t));
  timers.set(t, setTimeout(()=>{ timers.delete(t); sv.dirty = timers.size; commitField(t, true); }, 800)); sv.dirty = timers.size; paintSave();
}
window.addEventListener("beforeunload", e=>{ if(sv.pending || sv.dirty || sv.err || state.draftAdd){ e.preventDefault(); e.returnValue = ""; } });

const STATUSES = [["progress","In progress"],["planned","Planned"],["done","Done"],["idea","Idea"]];
const stageOf = s => ({idea:"Idea", planned:"Planned", progress:"Live", done:"Done/Paused"}[s]);
const statusOf = g => g === "Live" ? "progress" : g === "Done/Paused" ? "done" : (g === "Planned" || g === "In Preparation") ? "planned" : "idea";
const areaNames = () => CFG.areas.map(a=>a.n);
const areaGroup = (n, cfg = CFG) => (cfg.areas.find(a=>norm(a.n) === norm(n)) || {}).g || "Website";
// a card's type = the most specific of its tags that is a known type; older cards fall back to a guess, then to "Other"
function areaOf(c, cfg = CFG){
  const tags = (c.tags || []).map(String);
  for(const t of tags.slice().reverse()){ const a = cfg.areas.find(x=>norm(x.n) === norm(t)); if(a) return a.n; }
  const low = tags.join("|").toLowerCase();
  const ad = (/advertis|google ads|paid|meta ads|tiktok|search ads|hotel ads/.test(low)) ? (cfg.areas.find(x=>x.g === "Advertising") || {}).n : "";
  if(ad) return ad;
  for(const [re, name] of [[/seo/, "SEO"], [/content|locali/, "Content"], [/website|cro|ux/, "Website"]]){ if(re.test(low)){ const a = cfg.areas.find(x=>norm(x.n) === norm(name)); if(a) return a.n; } }
  return (cfg.areas.find(x=>norm(x.n) === "other") || cfg.areas[0]).n;
}
// the report groups cards by two tags ("Website" / "Advertising"); the second tag is the type
function tagsOf(name, cfg = CFG){ const base = areaGroup(name, cfg) === "Advertising" ? "Advertising" : "Website"; return norm(name) === norm(base) ? [base] : [base, name]; }

function validateDraft(d){
  for(const [list, label, keys] of [[d.channels, "channel", ["n", "s"]], [d.areas, "activity type", ["n"]]]){
    for(const k of keys){ const seen = new Map();
      for(const x of list){ const v = String(x[k] || "").trim(); if(!v) return `A ${label} has an empty ${k === "s" ? "short label" : "name"}.`; const nv = norm(v) || v.toLowerCase(); if(seen.has(nv)) return `“${v}” is already used by another ${label}${k === "s" ? " (short label)" : ""}. Names must be unique — use ✕ on one of them and choose where to merge it.`; seen.set(nv, 1); } } }
  return "";
}
function moveDialog(kind, i){

  if(!x.orig || !used){ list.splice(i, 1); return renderSettings(); }

    <select class="inp" id="mergeTo">${others.map(o=>`<option value="${esc(kind === "ch" ? o.k : o.orig || o.n)}">${esc(o.n)}</option>`).join("")}${kind === "ch" ? '<option value="">— just remove it from the hotels —</option>' : ""}</select>

}
async function applySettings(){
  const d = state.draft, oldCfg = JSON.parse(JSON.stringify(CFG)), err = validateDraft(d); if(err){ d.err = err; return renderSettings(); }
  const newCh = d.channels.map(c=>({k:c.k, n:c.n.trim(), s:c.s.trim()})), newAr = d.areas.map(a=>({n:a.n.trim(), g:a.g === "Advertising" ? "Advertising" : "Website"}));
  const newCfg = {channels:newCh, areas:newAr, reportUrl:$("setReport").value.trim() || "dmh_hotel_report.html"};
  // which activity items must be re-tagged: renamed types, changed report group, removed types (moved)
  const toName = new Map(); d.areas.forEach(a=>{ if(a.orig) toName.set(norm(a.orig), a.n.trim()); }); d.amoves.forEach(m=>{ const t = d.areas.find(a=>(a.orig || a.n) === m.to); toName.set(norm(m.from), t ? t.n.trim() : m.to); });
  const retag = []; hotels.forEach(h=>h.progress.cards.forEach(c=>{ const was = areaOf(c, oldCfg), now = toName.get(norm(was)); if(now === undefined) return; const og = areaGroup(was, oldCfg), ng = areaGroup(now, newCfg); if(norm(was) !== norm(now) || og !== ng) retag.push([h, c.id, now]); }));

}

    let id; do{ id = "HTL-" + Math.random().toString(36).slice(2, 7).toUpperCase(); }while(byId(id));
    const rec = {id, sections:{hotelData:{fields:{name, location:$("nh-loc").value.trim(), csm:$("nh-csm").value.trim()}, tables:{}, tags:{}}}, hub:{num:numv, channels:{}, todo:[], reports:{}}};
    await guard(async ()=>{ await stSet(`dmh-hotel:${id}`, JSON.stringify(rec)); await mutate("dmh-hotel-index", [], ix=>{ if(!ix.some(x=>x.id === id)) ix.push({id, name}); }); });
    hotels.push({id, rec, results:{periods:[]}, progress:{cards:[], ideas:[], generalNotes:[]}}); normalize(hotels[hotels.length - 1]); hotels.sort((a, b)=>F(a, "name").localeCompare(F(b, "name"))); closeModal(); state.hotel = id; render();
  },
  addchan(){ state.draft.channels.push({k:"c" + Date.now().toString(36), n:"", s:""}); renderSettings(); }, addarea(){ state.draft.areas.push({n:"", g:"Website"}); renderSettings(); },
  delchan(t){ moveDialog("ch", +t.dataset.i); }, delarea(t){ moveDialog("ar", +t.dataset.i); },
  confirmmerge(){ const d = state.draft, {kind, i} = state.mergeFrom, to = $("mergeTo").value, list = kind === "ch" ? d.channels : d.areas, x = list[i];
    if(kind === "ch") d.cmoves.push({from:x.orig, to}); else d.amoves.push({from:x.orig, to});
    list.splice(i, 1); closeModal(); renderSettings(); },
  cancelsettings(){ state.draft = null; renderSettings(); },
  savesettings: applySettings
};
document.addEventListener("click", e=>{ const t = e.target.closest("[data-act]"); if(t && H[t.dataset.act]){ e.preventDefault(); H[t.dataset.act](t, e); } const m = $("colMenu"); if(m && !m.hidden && !e.target.closest("#colMenu") && !(t && t.dataset.act === "colmenu")) m.hidden = true; });
document.addEventListener("input", e=>{
  const t = e.target, d = t.dataset;
  if(d.tdnote !== undefined || d.prof !== undefined || d.hub !== undefined || d.wf === "title" || d.wf === "notes") schedule(t);
  if(t.id === "tdText" || t.id === "wTitle"){ state.draftAdd = t.value.trim() !== ""; paintSave(); }
});
document.addEventListener("keydown", e=>{ if(e.key === "Enter" && !e.shiftKey && (e.target.id === "tdText" || e.target.id === "wTitle")){ e.preventDefault(); const b = document.querySelector(e.target.id === "tdText" ? "[data-act=addtodo]" : "[data-act=addwork]"); if(b) b.click(); } });
document.addEventListener("input", e=>{
  const t = e.target; if(t.id === "q"){ state.f.q = t.value; renderGrid(); }
  if(t.dataset.cr !== undefined){ state.drawer.rows[+t.dataset.cr][t.dataset.k] = t.value; if(t.dataset.k === "revenue") feeLine(); }
  if(t.id === "m-rev") feeLine();
});
async function commitField(t, fromInput){
  if(timers.has(t)){ clearTimeout(timers.get(t)); timers.delete(t); sv.dirty = timers.size; }
  const d = t.dataset;
  if(d.flt){ if(d.flt === "month") state.month = t.value; else if(d.flt === "todo") state.f.todo = t.checked; else if(d.flt === "showDone"){ state.showDone = t.checked; return renderTodo(); } else if(d.flt === "todoCsm"){ state.todoCsm = t.value; return renderTodo(); } else state.f[d.flt] = t.value; return renderGrid(); }
  if(d.dr){ state.draft[d.dr === "ch" ? "channels" : "areas"][+d.i][d.k] = t.value; return; }
  if(d.cell){ const h = byId(d.h), f = d.cell, val = t.value.trim() === "" ? "" : num(t.value);
    await guard(()=>mutateResults(h, state.month, p=>{ if(f === "rev") p.totalRevenue = val; else if(f === "bk") p.totalBookings = val; else { p.rows = p.rows || []; if(!p.rows.length) p.rows.push({campaign:"Paid (total)", channel:"Paid", spend:"", traffic:"", bookings:"", revenue:""}); p.rows[0][{pbk:"bookings", prev:"revenue", spend:"spend"}[f]] = val; } })); return renderGrid(); }
  if(d.rep){ const h = byId(d.rep), lab = d.m || state.month; await guard(()=>mutateRecord(h, r=>{ r.hub.reports = Object.assign({}, r.hub.reports, {[lab]:t.value}); })); return; }
  if(d.prof){ const h = byId(state.hotel); await guard(()=>mutateRecord(h, r=>{ r.sections.hotelData.fields[d.prof] = t.value.trim(); })); if(d.prof === "name") await guard(()=>mutate("dmh-hotel-index", [], ix=>{ const x = ix.find(i=>i.id === h.id); if(x) x.name = t.value.trim(); })); return; }
  if(d.col){ const hid = hiddenCols(); if(t.checked) hid.delete(d.col); else hid.add(d.col); localStorage.setItem("dmh-hub-cols", JSON.stringify([...hid])); return renderGrid(); }
  if(d.hub){ const h = byId(state.hotel); const v = t.value.trim(); if(d.hub === "num" && v && hotels.some(x=>x.id !== h.id && exId(x) === v)){ say("Another hotel already has this Exely ID", true); t.value = h.rec.hub.num || ""; return; } await guard(()=>mutateRecord(h, r=>{ r.hub[d.hub] = v; })); if(d.hub === "num" && !fromInput) render(); return; }
  if(d.fee){
    const h = byId(state.hotel), sel = document.querySelector("[data-fee=type]"), amt = document.querySelector("[data-fee=pct],[data-fee=fixed]"), type = sel.value;
    const prev = (tariff(h) || {}).type || "", unitChanged = (type === "fixed") !== (prev === "fixed");
    const raw = (d.fee === "type" && unitChanged) ? "" : (amt ? amt.value.trim() : ""), val = raw === "" ? "" : num(raw);
    const fee = !type ? {type:""} : (type === "fixed" ? {type, fixed:val} : {type, pct:val});
    h.rec.hub.fee = fee; if(d.fee === "type") render();                      // show it immediately
    await guard(()=>mutateRecord(h, r=>{ r.hub.fee = fee; })); return; }
  if(d.tdnote){ const h = byId(d.h); await guard(()=>mutateRecord(h, r=>{ const x = (r.hub.todo || []).find(i=>i.id === d.tdnote); if(x) x.note = t.value; })); return; }
  if(d.td){ const h = byId(d.h || state.hotel); const pr = guard(()=>mutateRecord(h, r=>{ const x = (r.hub.todo || []).find(i=>i.id === d.td); if(x) x.done = t.checked; })); render(); return pr; }
  if(d.wf){ const card = t.closest(".work").dataset.card, h = byId(state.hotel);
    await guard(()=>mutateProgress(h, p=>{ const c = p.cards.find(x=>x.id === card); if(!c) return; if(d.wf === "title") c.title = t.value; else if(d.wf === "notes") c.notes = t.value; else if(d.wf === "period") c.period = t.value; else if(d.wf === "status") c.stage = stageOf(t.value); else if(d.wf === "area") c.tags = tagsOf(t.value); }));
    if(["status", "area"].includes(d.wf)) render(); return; }
  if(t.id === "repMonth") state.month = t.value;
}
document.addEventListener("change", e=>commitField(e.target));
async function addImages(cardId, files){
  const h = byId(state.hotel); if(!files.length) return;
  await guard(async ()=>{ for(const f of files){ const id = await storeImage(await compressImage(f)); await mutateProgress(h, p=>{ const c = p.cards.find(x=>x.id === cardId); if(c) (c.images = c.images || []).push({id, caption:""}); }); } });
  state.openWork[cardId] = true; render();
}
document.addEventListener("paste", e=>{ const w = document.activeElement && document.activeElement.closest && document.activeElement.closest(".work"); if(!w) return; const files = [...(e.clipboardData ? e.clipboardData.files : [])].filter(f=>f.type.startsWith("image/")); if(files.length){ e.preventDefault(); addImages(w.dataset.card, files); } });
document.addEventListener("focusin", e=>{ const t = e.target; if(t.classList && t.classList.contains("cell")){ t.value = t.dataset.raw; t.select(); } });
document.addEventListener("focusout", e=>{ const t = e.target; if(t.classList && t.classList.contains("cell") && t.value === t.dataset.raw) t.value = t.dataset.fmt; });
document.addEventListener("input", e=>{ const t = e.target; if(t.dataset.dr){ state.draft[t.dataset.dr === "ch" ? "channels" : "areas"][+t.dataset.i][t.dataset.k] = t.value; state.draft.err = ""; const er = $("setErr"); if(er) er.style.display = "none"; } });
// coming back to the tab: pick up changes made in the other DMH tools
let hiddenAt = 0;
document.addEventListener("visibilitychange", async ()=>{ if(document.hidden){ hiddenAt = Date.now(); return; } if(hiddenAt && Date.now() - hiddenAt > 8000 && !state.drawer && !document.activeElement.matches("input,textarea,select")){ try{ await loadAll(); render(); }catch(e){} } });

(async function init(){
  paintSave();
  if(window.__DEMO) $("demoBanner").hidden = false;
  try{ await loadAll(); render(); }catch(e){ app.innerHTML = `<div class="empty">⚠ ${esc(e.message)}<br><br><button class="btn" data-act="tab" data-t="settings">Open Settings</button></div>`; say(e.message, true); }
})();

</script>
