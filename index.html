<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DMH Marketing Workspace</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --paper:#F5F4EF; --card:#FFFFFF; --ink:#1C2620; --ink-soft:#5B6660;
    --line:#E1DDCE; --teal:#0E6E55; --teal-soft:#E4EFE9;
    --brick:#AE4A2E; --brick-soft:#F6E7E1;
    --mustard:#A9791B; --mustard-soft:#F5EBD3;
    --slate:#8C8A7E; --slate-soft:#EEECE3;
    --purple:#5A4A8C; --purple-soft:#EAE6F5;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;}
  .shell{max-width:1160px;margin:0 auto;padding:20px 24px 70px;}
  h1{font-family:'Fraunces',serif;font-size:21px;font-weight:700;margin:0 0 4px;}
  .sub{font-size:12px;color:var(--ink-soft);margin-bottom:16px;}
  .header-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    font-family:'IBM Plex Sans',sans-serif;border:1px solid var(--line);border-radius:6px;
    padding:7px 9px;font-size:13px;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:44px;width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .btn{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:12.5px;border-radius:6px;border:1px solid var(--teal);background:var(--teal);color:#fff;padding:8px 14px;cursor:pointer;}
  .btn.secondary{background:#fff;color:var(--teal);}
  .btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  .btn.danger{background:#fff;color:var(--brick);border-color:var(--brick);}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .btn.sm{padding:5px 10px;font-size:11.5px;}
  .status-text{font-size:11px;color:var(--ink-soft);}
  .nav{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .nav-tab{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;padding:9px 15px;cursor:pointer;color:var(--ink-soft);border-bottom:2px solid transparent;}
  .nav-tab.active{color:var(--teal);border-bottom-color:var(--teal);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px;}
  .card-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin:0 0 8px;}
  .card-note{font-size:11.5px;color:var(--ink-soft);margin:-4px 0 12px;}
  .empty-state{color:var(--ink-soft);padding:40px;text-align:center;}
  .ptabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;}
  .ptab{font-family:'IBM Plex Mono',monospace;font-size:11px;white-space:nowrap;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ink-soft);border:1px solid var(--line);background:#fff;}
  .ptab.active{background:var(--teal-soft);color:var(--teal);border-color:var(--teal);font-weight:600;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:8px;}
  .field.full{grid-column:1/-1;}
  .group-block{margin-top:18px;}
  .group-label{font-family:'Fraunces',serif;font-size:13.5px;font-weight:600;margin-bottom:8px;}
  table.rep{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:12.5px;}
  table.rep th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);text-align:left;padding:4px 7px;border-bottom:1px solid var(--line);}
  table.rep td{padding:4px 7px 8px;vertical-align:top;}
  .rep-remove{background:none;border:none;color:var(--brick);cursor:pointer;font-size:15px;padding:4px;}
  .tag-group{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;align-items:center;}
  .tag{font-size:12px;padding:6px 11px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink-soft);user-select:none;}
  .tag.selected{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}
  .tag-add{display:flex;gap:6px;align-items:center;}
  .manage-panel{background:var(--slate-soft);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:18px;}
  .manage-note{font-size:11px;color:var(--ink-soft);margin-bottom:12px;}
  .manage-group{margin-bottom:16px;}
  .manage-group-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
  .manage-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #E7E3D6;font-size:12.5px;}
  .manage-row .mlabel{flex:1;}
  .manage-row .mtype{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--slate);}
  .add-field-form{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center;}
  .context-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:12.5px;}
  .ctx-item{background:var(--slate-soft);border-radius:7px;padding:8px 10px;}
  .ctx-item .ctx-label{font-size:10px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.05em;}
  .ctx-item .ctx-val{font-weight:600;font-size:13px;margin-top:2px;}
  details summary{cursor:pointer;font-size:12px;color:var(--ink-soft);font-weight:600;}
  .hint-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px;margin-top:8px;}
  .hint-item{background:var(--slate-soft);border-radius:7px;padding:8px 10px;}
  .hint-item b{color:var(--purple);}
  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start;}
  .board-col{background:var(--slate-soft);border-radius:8px;padding:8px;min-height:80px;}
  .board-col-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;margin-bottom:8px;padding:0 2px;}
  .p-card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin-bottom:8px;cursor:pointer;}
  .p-card-title{font-weight:600;font-size:12.5px;margin-bottom:3px;}
  .p-card-meta{font-size:10.5px;color:var(--ink-soft);}
  .p-card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;}
  .p-tag{font-size:9.5px;padding:1px 7px;border-radius:9px;background:var(--purple-soft);color:var(--purple);}
  .p-detail{background:var(--card);border:1px solid var(--teal);border-radius:8px;padding:14px 16px;margin-bottom:16px;}
  .subtask-row{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid #EFEDE3;}
  .subtask-row input[type=text]{flex:2;}
  .subtask-row input[type=text].link{flex:1.5;}
  .idea-item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
  @media (max-width:900px){ .board{grid-template-columns:1fr 1fr;} }
  @media (max-width:800px){ .form-grid{grid-template-columns:1fr;} .context-grid{grid-template-columns:1fr 1fr;} .hint-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="shell">
  <h1>DMH marketing workspace</h1>
  <div class="sub">One shared workspace: hotel facts, strategy decisions, execution progress, and results — all reading the same records.</div>

  <div class="header-card">
    <div class="row">
      <div class="field" style="min-width:240px;">
        <label for="hotelSelect">Hotel</label>
        <select id="hotelSelect"><option value="">Loading...</option></select>
      </div>
      <button class="btn secondary sm" id="newHotelBtn">+ New hotel</button>
      <button class="btn danger sm" id="deleteHotelBtn">Delete hotel</button>
      <span class="status-text" id="globalStatus"></span>
    </div>
  </div>

  <div class="nav">
    <div class="nav-tab active" data-tab="input">Hotel input</div>
    <div class="nav-tab" data-tab="strategy">Strategy</div>
    <div class="nav-tab" data-tab="progress">Progress</div>
    <div class="nav-tab" data-tab="results">Results</div>
  </div>

  <div id="tabInput"></div>
  <div id="tabStrategy" style="display:none;"></div>
  <div id="tabProgress" style="display:none;"></div>
  <div id="tabResults" style="display:none;"></div>
</div>

<datalist id="sharedTagsList"></datalist>

<script>
const el = id => document.getElementById(id);

/* =========================================================
   STORAGE BACKEND — Google Sheets via Apps Script Web App
   Paste your deployed /exec URL below (see google_apps_script_backend.gs).
   Until you do, the tool will show a clear setup message instead of
   silently failing.
========================================================= */
const SHEETS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxKHZNNI6QlVeyv9Q982-ErEYSXkIdD6vTt0Lpq5z2YMCA_-cR1KROjWjM_p_tzolDSVw/exec";

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error(`Timed out waiting for ${label} (no response after ${ms/1000}s)`)), ms))
  ]);
}

function checkBackendConfigured(){
  if(!SHEETS_WEBAPP_URL || SHEETS_WEBAPP_URL.indexOf("PASTE_YOUR") === 0){
    throw new Error("Google Sheets backend is not configured yet — paste your deployed Apps Script URL into SHEETS_WEBAPP_URL near the top of the script.");
  }
}

async function stGet(key, shared){
  checkBackendConfigured();
  const res = await withTimeout(
    fetch(`${SHEETS_WEBAPP_URL}?key=${encodeURIComponent(key)}`),
    12000, `loading "${key}"`
  );
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return { key: data.key, value: data.value, shared: true };
}

async function stSet(key, value, shared){
  checkBackendConfigured();
  const res = await withTimeout(
    fetch(SHEETS_WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight
      body: JSON.stringify({ action: "set", key, value })
    }),
    12000, `saving "${key}"`
  );
  const data = await res.json();
  return { key: data.key, value: data.value, shared: true };
}

async function stDelete(key, shared){
  checkBackendConfigured();
  const res = await withTimeout(
    fetch(SHEETS_WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "delete", key })
    }),
    12000, `deleting "${key}"`
  );
  const data = await res.json();
  return { key: data.key, deleted: true, shared: true };
}

let hotelIndex = [];
let currentHotel = null;
let activeTab = "input";
let sharedTags = [];
const DEFAULT_SHARED_TAGS = [
  "SEO","AI Search / GEO","Google Search Ads","Google Hotel Ads","Bing / Yandex Search","Display Ads",
  "Meta Ads","TikTok Ads","Email / CRM","Referral & Travel Listings","Google Business Profile",
  "Website / CRO","Content & Localization","Offers & Promotions","Rate & Package Strategy",
];

let loadHotelIndexWarning = null;
async function loadHotelIndex(){
  try{ const res = await stGet("dmh-hotel-index", true); hotelIndex = res && res.value ? JSON.parse(res.value) : []; }
  catch(e){ hotelIndex = []; if(e.message !== "not found") loadHotelIndexWarning = "hotel list didn't load: " + e.message; }
}
async function saveHotelIndex(){ await stSet("dmh-hotel-index", JSON.stringify(hotelIndex), true); }
async function loadHotelRecordById(id){
  try{ const res = await stGet(`dmh-hotel:${id}`, true); if(res && res.value) return JSON.parse(res.value); } catch(e){}
  return null;
}
async function saveHotelRecord(record){
  await stSet(`dmh-hotel:${record.id}`, JSON.stringify(record), true);
  const idx = hotelIndex.findIndex(h=>h.id===record.id);
  const name = record.sections.hotelData.fields.name || record.id;
  if(idx>=0) hotelIndex[idx].name = name; else hotelIndex.push({id:record.id, name});
  await saveHotelIndex();
}
function getField(hotel, sectionId, key){ return hotel?.sections?.[sectionId]?.fields?.[key] || ""; }

let loadSharedTagsWarning = null;
async function loadSharedTags(){
  let notFound = false;
  try{
    const res = await stGet("dmh-shared-tags", true);
    sharedTags = res && res.value ? JSON.parse(res.value) : null;
    if(!sharedTags) notFound = true;
  } catch(e){
    sharedTags = null;
    if(e.message !== "not found") loadSharedTagsWarning = "tags didn't load: " + e.message;
    else notFound = true; // "not found" style errors mean this key genuinely doesn't exist yet
  }
  if(!sharedTags){
    sharedTags = DEFAULT_SHARED_TAGS.slice();
    if(notFound){ try{ await stSet("dmh-shared-tags", JSON.stringify(sharedTags), true); } catch(e){} }
  }
  const dl = el("sharedTagsList");
  dl.innerHTML = sharedTags.map(t=>`<option value="${t}">`).join("");
}
async function addSharedTag(val){
  if(!val || sharedTags.includes(val)) return;
  sharedTags.push(val);
  await stSet("dmh-shared-tags", JSON.stringify(sharedTags), true);
  const dl = el("sharedTagsList");
  dl.innerHTML = sharedTags.map(t=>`<option value="${t}">`).join("");
}

async function renameSharedTag(oldTag, newTag){
  newTag = newTag.trim();
  if(!newTag || newTag===oldTag) return {changed:false, updatedRecords:0};
  const dup = sharedTags.includes(newTag);
  sharedTags = dup ? sharedTags.filter(t=>t!==oldTag) : sharedTags.map(t=> t===oldTag ? newTag : t);
  await stSet("dmh-shared-tags", JSON.stringify(sharedTags), true);
  el("sharedTagsList").innerHTML = sharedTags.map(t=>`<option value="${t}">`).join("");

  let updatedRecords = 0;
  for(const h of hotelIndex){
    let touched = false;
    try{
      const res = await stGet(`dmh-progress:${h.id}`, true);
      if(res && res.value){
        const prog = JSON.parse(res.value);
        (prog.cards||[]).forEach(c=>{
          if(c.tags && c.tags.includes(oldTag)){ c.tags = [...new Set(c.tags.map(t=> t===oldTag?newTag:t))]; touched = true; }
        });
        if(touched) await stSet(`dmh-progress:${h.id}`, JSON.stringify(prog), true);
      }
    } catch(e){}
    let touched2 = false;
    try{
      const res = await stGet(`dmh-strategy:${h.id}`, true);
      if(res && res.value){
        const strat = JSON.parse(res.value);
        (strat.activities||[]).forEach(a=>{ if(a.activity===oldTag){ a.activity=newTag; touched2=true; } });
        if(strat.targetMarkets && strat.targetMarkets.segments && strat.targetMarkets.segments.includes(oldTag)){
          strat.targetMarkets.segments = [...new Set(strat.targetMarkets.segments.map(s=> s===oldTag?newTag:s))];
          touched2 = true;
        }
        if(touched2) await stSet(`dmh-strategy:${h.id}`, JSON.stringify(strat), true);
      }
    } catch(e){}
    let touched3 = false;
    try{
      const res = await stGet(`dmh-results:${h.id}`, true);
      if(res && res.value){
        const results = JSON.parse(res.value);
        (results.periods||[]).forEach(p=>{ (p.rows||[]).forEach(r=>{ if(r.channel===oldTag){ r.channel=newTag; touched3=true; } }); });
        if(touched3) await stSet(`dmh-results:${h.id}`, JSON.stringify(results), true);
      }
    } catch(e){}
    if(touched||touched2||touched3) updatedRecords++;
  }
  currentProgress = null; currentStrategy = null; currentResults = null;
  return {changed:true, updatedRecords};
}

async function removeSharedTag(tag){
  sharedTags = sharedTags.filter(t=>t!==tag);
  await stSet("dmh-shared-tags", JSON.stringify(sharedTags), true);
  el("sharedTagsList").innerHTML = sharedTags.map(t=>`<option value="${t}">`).join("");
}

function populateHotelSelect(){
  const sel = el("hotelSelect");
  const prev = sel.value;
  sel.innerHTML = '<option value="">Select a hotel...</option>';
  hotelIndex.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(h=>{
    const opt = document.createElement("option"); opt.value = h.id; opt.textContent = `${h.name} (${h.id})`; sel.appendChild(opt);
  });
  if(prev) sel.value = prev;
}
el("hotelSelect").addEventListener("change", async ()=>{
  const id = el("hotelSelect").value;
  el("globalStatus").textContent = id ? "Loading hotel..." : "";
  try{
    currentHotel = id ? await loadHotelRecordById(id) : null;
    el("globalStatus").textContent = "";
  } catch(err){
    el("globalStatus").textContent = "⚠ Could not load this hotel: " + err.message;
  }
  renderActiveTab();
});
el("newHotelBtn").addEventListener("click", async ()=>{
  const name = prompt("New hotel name:"); if(!name) return;
  const id = "HTL-" + Math.random().toString(36).slice(2,7).toUpperCase();
  currentHotel = blankHotelRecord(id);
  currentHotel.sections.hotelData.fields.name = name;
  el("globalStatus").textContent = "Saving new hotel...";
  try{
    await saveHotelRecord(currentHotel);
    el("globalStatus").textContent = "";
    populateHotelSelect(); el("hotelSelect").value = id; renderActiveTab();
  } catch(err){
    el("globalStatus").textContent = "⚠ Could not save new hotel: " + err.message;
  }
});
el("deleteHotelBtn").addEventListener("click", async ()=>{
  if(!currentHotel) return;
  const name = getField(currentHotel,"hotelData","name") || currentHotel.id;
  if(!confirm(`Delete the profile for "${name}"? This removes it everywhere in this workspace.`)) return;
  try{ await stDelete(`dmh-hotel:${currentHotel.id}`, true); }catch(e){}
  hotelIndex = hotelIndex.filter(h=>h.id!==currentHotel.id);
  await saveHotelIndex(); currentHotel = null; populateHotelSelect(); el("hotelSelect").value = ""; renderActiveTab();
});

document.querySelectorAll(".nav-tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    document.querySelectorAll(".nav-tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active"); activeTab = tab.dataset.tab;
    ["input","strategy","progress","results"].forEach(t=>{
      el("tab"+t.charAt(0).toUpperCase()+t.slice(1)).style.display = (t===activeTab) ? "block" : "none";
    });
    renderActiveTab();
  });
});
function renderActiveTab(){
  if(activeTab==="input") renderInputTab();
  else if(activeTab==="strategy") renderStrategyTab();
  else if(activeTab==="progress") renderProgressTab();
  else if(activeTab==="results") renderResultsTab();
}

/* =========================================================
   MODULE: HOTEL INPUT (facts only — 8 sections)
========================================================= */
function defaultSchema(){
  return { sections: [
    { id:"hotelData", num:"01", title:"Hotel Data",
      fields:[
        {key:"name", label:"Hotel Name", type:"text", full:true, hidden:false},
        {key:"location", label:"Location (City, Country)", type:"text", hidden:false},
        {key:"propertyType", label:"Property Type", type:"select", options:["City Hotel","Resort","Villa / Boutique / Luxury","Cruise"], hidden:false},
        {key:"website", label:"Website", type:"text", hidden:false},
        {key:"csm", label:"CSM", type:"text", hidden:false},
        {key:"rooms", label:"Number of Rooms", type:"number", hidden:false},
        {key:"stars", label:"Star Rating", type:"select", options:["1","2","3","4","5"], hidden:false},
        {key:"gbp", label:"Google Business Profile", type:"text", hidden:false},
        {key:"startDate", label:"Start Date", type:"date", hidden:false},
        {key:"modelType", label:"Model Type", type:"text", hidden:false},
        {key:"abv", label:"ABV", type:"number", hidden:false},
        {key:"currentDirectRevenue", label:"Current Monthly Direct Revenue, $", type:"number", hidden:false},
        {key:"onlineAvailability", label:"Online Availability, %", type:"number", hidden:false},
        {key:"websiteTrafficBaseline", label:"Website Traffic (baseline, typical month)", type:"number", hidden:false},
        {key:"beTrafficBaseline", label:"Booking Engine Traffic (baseline, typical month)", type:"number", hidden:false},
        {key:"trafficBaselineNote", label:"Traffic Baseline Note (e.g. \"measured in low season\")", type:"text", full:true, hidden:false},
        {key:"notes", label:"Notes", type:"textarea", full:true, hidden:false},
      ], tables:[], tagGroups:[] },
    { id:"budgets", num:"02", title:"Budgets",
      fields:[
        {key:"m1", label:"Month 1 Budget", type:"number", hidden:false},
        {key:"m2", label:"Month 2 Budget", type:"number", hidden:false},
        {key:"m3", label:"Month 3+ Budget", type:"number", hidden:false},
        {key:"cap", label:"Budget Cap", type:"number", hidden:false},
        {key:"growthPlan", label:"Growth Plan / Conditions", type:"textarea", full:true, hidden:false},
      ], tables:[], tagGroups:[] },
    { id:"sourceMarkets", num:"03", title:"Source Markets",
      fields:[ {key:"languages", label:"Target Languages", type:"text", full:true, hidden:false} ],
      tables:[{ id:"markets", label:"Markets", addLabel:"+ Add market",
        columns:[
          {key:"country", label:"Country", type:"text", hidden:false},
          {key:"share", label:"Share %", type:"number", hidden:false},
          {key:"trend", label:"Trend", type:"select", options:["Growth","Stable","Decline"], hidden:false},
          {key:"notes", label:"Notes / Limitations", type:"text", hidden:false},
        ]}], tagGroups:[] },
    { id:"limitations", num:"04", title:"Limitations",
      fields:[
        {key:"operational", label:"Operational", type:"textarea", full:true, hidden:false},
        {key:"commercial", label:"Commercial", type:"textarea", full:true, hidden:false},
        {key:"legal", label:"Legal", type:"textarea", full:true, hidden:false},
        {key:"inventory", label:"Inventory / Availability", type:"textarea", full:true, hidden:false},
        {key:"other", label:"Other", type:"textarea", full:true, hidden:false},
      ], tables:[], tagGroups:[] },
    { id:"access", num:"05", title:"Access", fields:[],
      tables:[{ id:"accessList", label:"Access", addLabel:"+ Add access item",
        columns:[
          {key:"system", label:"System", type:"text", hidden:false},
          {key:"status", label:"Status", type:"select", options:["Yes","In progress","No","Not required"], hidden:false},
          {key:"notes", label:"Notes", type:"text", hidden:false},
        ]}], tagGroups:[] },
    { id:"currentMarketing", num:"06", title:"Current Marketing",
      fields:[ {key:"previousAgencies", label:"Previous Agencies", type:"select", options:["Yes","No","Other"], hidden:false} ],

let loadSchemaWarning = null;
async function loadSchema(){
  try{ const res = await stGet("dmh-schema", true); SCHEMA = res && res.value ? JSON.parse(res.value) : defaultSchema(); }
  catch(e){ SCHEMA = defaultSchema(); if(e.message !== "not found") loadSchemaWarning = "field setup didn't load: " + e.message; }
  if(!SCHEMA || !SCHEMA.sections) SCHEMA = defaultSchema();
  try{ if(mergeSchemaDefaults(SCHEMA)) await saveSchema(); } catch(e){}
}
function mergeSchemaDefaults(schema){
  const defaults = defaultSchema();
  let changed = false;
  defaults.sections.forEach(defSec=>{
    let sec = schema.sections.find(s=>s.id===defSec.id);
    if(!sec){ schema.sections.push(JSON.parse(JSON.stringify(defSec))); changed = true; return; }
    defSec.fields.forEach(df=>{
      if(!sec.fields.find(f=>f.key===df.key)){ sec.fields.push({...df}); changed = true; }
    });
    defSec.tables.forEach(dt=>{
      let t = sec.tables.find(tt=>tt.id===dt.id);
      if(!t){ sec.tables.push(JSON.parse(JSON.stringify(dt))); changed = true; return; }
      dt.columns.forEach(dc=>{
        if(!t.columns.find(c=>c.key===dc.key)){ t.columns.push({...dc}); changed = true; }
      });
    });
    defSec.tagGroups.forEach(dtg=>{
      if(!sec.tagGroups.find(g=>g.key===dtg.key)){ sec.tagGroups.push(JSON.parse(JSON.stringify(dtg))); changed = true; }
    });
  });
  return changed;
}
async function saveSchema(){ await stSet("dmh-schema", JSON.stringify(SCHEMA), true); }

function blankHotelRecord(id){

      rec.sections[s.id].tables[t.id] = (s.id==="access" && t.id==="accessList")
        ? JSON.parse(JSON.stringify(DEFAULT_ACCESS_ROWS)) : [];
    });
    s.tagGroups.forEach(tg=>{ rec.sections[s.id].tags[tg.key] = []; });

}
function ensureSectionData(sectionDef){

  sectionDef.tagGroups.forEach(tg=>{ if(!sd.tags[tg.key]) sd.tags[tg.key] = []; });
  return sd;
}
function slugify(str){ let s = str.toLowerCase().trim().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); return s || ("field_"+Date.now()); }
function uniqueKey(base, existingKeys){ let key = base, i = 1; while(existingKeys.includes(key)){ key = base+"_"+(++i); } return key; }

function makeFieldInput(dataObj, f){
  const wrap = document.createElement("div"); wrap.className = "field" + (f.full ? " full" : "");
  const label = document.createElement("label"); label.textContent = f.label; wrap.appendChild(label);
  let input;
  if(f.type==="textarea"){ input = document.createElement("textarea"); input.value = dataObj[f.key] || ""; }
  else if(f.type==="select"){
    input = document.createElement("select");
    const blank = document.createElement("option"); blank.value=""; blank.textContent="—"; input.appendChild(blank);
    (f.options||[]).forEach(o=>{ const opt=document.createElement("option"); opt.value=o; opt.textContent=o; input.appendChild(opt); });
    input.value = dataObj[f.key] || "";
  } else { input = document.createElement("input"); input.type = f.type; input.value = dataObj[f.key] || ""; }
  input.addEventListener("input", ()=>{ dataObj[f.key] = input.value; });
  if(f.type==="select") input.addEventListener("change", ()=>{ dataObj[f.key] = input.value; });
  wrap.appendChild(input); return wrap;
}

/* Generic repeatable table renderer — used across Hotel Input, Strategy, Results.
   rerenderFn is called after add/remove so the caller's view refreshes. */
function renderTable(tableDef, rows, rerenderFn){
  const wrap = document.createElement("div");
  const visibleCols = tableDef.columns.filter(c=>!c.hidden);
  const table = document.createElement("table"); table.className = "rep";
  const headRow = document.createElement("tr");
  visibleCols.forEach(col=>{ const th=document.createElement("th"); th.textContent=col.label; headRow.appendChild(th); });
  headRow.appendChild(document.createElement("th"));
  table.appendChild(headRow);
  rows.forEach((row,i)=>{
    const tr = document.createElement("tr");
    visibleCols.forEach(col=>{
      const td = document.createElement("td");
      let input;
      if(col.type==="select"){
        input = document.createElement("select");
        const blank=document.createElement("option"); blank.value=""; blank.textContent="—"; input.appendChild(blank);
        (col.options||[]).forEach(o=>{ const opt=document.createElement("option"); opt.value=o; opt.textContent=o; if(row[col.key]===o) opt.selected=true; input.appendChild(opt); });
      } else {
        input = document.createElement("input"); input.type = col.type; input.value = row[col.key] || "";
        if(col.datalist){ input.setAttribute("list", col.datalist); }
      }
      input.addEventListener("input", ()=>{ row[col.key] = input.value; });
      if(col.type==="select") input.addEventListener("change", ()=>{ row[col.key] = input.value; });
      td.appendChild(input); tr.appendChild(td);
    });
    const tdRemove = document.createElement("td");
    const btn = document.createElement("button"); btn.className="rep-remove"; btn.textContent="✕";
    btn.addEventListener("click", ()=>{ rows.splice(i,1); rerenderFn(); });
    tdRemove.appendChild(btn); tr.appendChild(tdRemove);
    table.appendChild(tr);
  });
  wrap.appendChild(table);
  const addBtn = document.createElement("button"); addBtn.className = "btn secondary sm";
  addBtn.textContent = tableDef.addLabel || "+ Add row";
  addBtn.addEventListener("click", ()=>{
    const newRow = {}; tableDef.columns.forEach(c=> newRow[c.key]=""); rows.push(newRow); rerenderFn();
  });
  wrap.appendChild(addBtn);
  return wrap;
}

/* Generic tag-picker — extendable groups persist new options to a shared list via onNewOption. */
function renderTagGroup(tg, selectedArr, rerenderFn, onSaveOptions){
  const wrap = document.createElement("div");
  const group = document.createElement("div"); group.className = "tag-group";
  tg.options.filter(o=>!(tg.hiddenOptions||[]).includes(o)).forEach(opt=>{
    const tag = document.createElement("div");
    tag.className = "tag" + (selectedArr.includes(opt) ? " selected" : "");
    tag.textContent = opt;
    tag.addEventListener("click", ()=>{
      const i = selectedArr.indexOf(opt);
      if(i>=0) selectedArr.splice(i,1); else selectedArr.push(opt);
      rerenderFn();
    });
    group.appendChild(tag);
  });
  wrap.appendChild(group);
  if(tg.extendable){
    const addWrap = document.createElement("div"); addWrap.className = "tag-add";
    const input = document.createElement("input"); input.type="text"; input.placeholder="Add new tag...";
    const btn = document.createElement("button"); btn.className="btn secondary sm"; btn.textContent="Add";
    btn.addEventListener("click", async ()=>{
      const val = input.value.trim(); if(!val) return;
      if(!tg.options.includes(val)) tg.options.push(val);
      if(!selectedArr.includes(val)) selectedArr.push(val);
      if(onSaveOptions) await onSaveOptions();
      rerenderFn();
    });
    addWrap.appendChild(input); addWrap.appendChild(btn); wrap.appendChild(addWrap);
  }
  return wrap;
}

function renderManagePanel(s){
  const panel = document.createElement("div"); panel.className = "manage-panel";
  panel.innerHTML = `<div class="manage-note">Hiding a field, column, or tag never deletes data already saved for any hotel — it only removes it from view. Changes apply for the whole team.</div>`;
  const fgroup = document.createElement("div"); fgroup.className="manage-group";
  fgroup.innerHTML = `<div class="manage-group-title">Fields</div>`;
  s.fields.forEach(f=>{
    const row = document.createElement("div"); row.className = "manage-row";
    row.innerHTML = `<input type="checkbox" ${!f.hidden?"checked":""}><span class="mlabel">${f.label}</span><span class="mtype">${f.type}</span>`;
    row.querySelector("input").addEventListener("change", async e=>{ f.hidden = !e.target.checked; await saveSchema(); });
    fgroup.appendChild(row);
  });
  fgroup.appendChild(makeAddFieldForm(async newField=>{
    newField.key = uniqueKey(slugify(newField.label), s.fields.map(f=>f.key));
    newField.hidden = false; s.fields.push(newField); await saveSchema(); renderInputTab();
  }));
  panel.appendChild(fgroup);
  s.tables.forEach(t=>{
    const g = document.createElement("div"); g.className="manage-group";
    g.innerHTML = `<div class="manage-group-title">Columns — ${t.label}</div>`;
    t.columns.forEach(col=>{
      const row = document.createElement("div"); row.className="manage-row";
      row.innerHTML = `<input type="checkbox" ${!col.hidden?"checked":""}><span class="mlabel">${col.label}</span><span class="mtype">${col.type}</span>`;
      row.querySelector("input").addEventListener("change", async e=>{ col.hidden = !e.target.checked; await saveSchema(); });
      g.appendChild(row);
    });
    g.appendChild(makeAddFieldForm(async newField=>{
      newField.key = uniqueKey(slugify(newField.label), t.columns.map(c=>c.key));
      newField.hidden = false; t.columns.push(newField); await saveSchema(); renderInputTab();
    }));
    panel.appendChild(g);
  });
  s.tagGroups.forEach(tg=>{
    const g = document.createElement("div"); g.className="manage-group";
    g.innerHTML = `<div class="manage-group-title">Tags — ${tg.label}</div>`;
    tg.options.forEach(opt=>{
      const hidden = (tg.hiddenOptions||[]).includes(opt);
      const row = document.createElement("div"); row.className="manage-row";
      row.innerHTML = `<input type="checkbox" ${!hidden?"checked":""}><span class="mlabel">${opt}</span>`;
      row.querySelector("input").addEventListener("change", async e=>{
        tg.hiddenOptions = tg.hiddenOptions||[];
        if(e.target.checked) tg.hiddenOptions = tg.hiddenOptions.filter(o=>o!==opt);
        else if(!tg.hiddenOptions.includes(opt)) tg.hiddenOptions.push(opt);
        await saveSchema();
      });
      g.appendChild(row);
    });
    panel.appendChild(g);
  });
  return panel;
}
function makeAddFieldForm(onAdd){
  const form = document.createElement("div"); form.className = "add-field-form";
  const labelInput = document.createElement("input"); labelInput.type="text"; labelInput.placeholder="New field label...";
  const typeSelect = document.createElement("select");
  ["text","number","textarea","date","select"].forEach(t=>{ const o=document.createElement("option"); o.value=t; o.textContent=t; typeSelect.appendChild(o); });
  const optionsInput = document.createElement("input"); optionsInput.type="text"; optionsInput.placeholder="Options (comma-separated)"; optionsInput.style.display="none"; optionsInput.style.width="200px";
  typeSelect.addEventListener("change", ()=>{ optionsInput.style.display = typeSelect.value==="select" ? "inline-block":"none"; });
  const addBtn = document.createElement("button"); addBtn.className="btn secondary sm"; addBtn.textContent="+ Add field";
  addBtn.addEventListener("click", ()=>{
    const label = labelInput.value.trim(); if(!label) return;
    const field = {label, type: typeSelect.value};
    if(typeSelect.value==="select") field.options = optionsInput.value.split(",").map(s=>s.trim()).filter(Boolean);
    onAdd(field); labelInput.value=""; optionsInput.value="";
  });
  form.appendChild(labelInput); form.appendChild(typeSelect); form.appendChild(optionsInput); form.appendChild(addBtn);
  return form;
}

function renderActivityPlan(monthKey, budgetRaw){
  const wrap = document.createElement("div");
  const controls = document.createElement("div"); controls.className = "row"; controls.style.marginBottom="10px";
  controls.innerHTML = `
    <div class="field"><label>Budget for ${MONTH_OPTIONS.find(m=>m[0]===monthKey)[1]}, $</label><input type="number" id="planBudget" value="${parseFloat(budgetRaw)||0}" style="width:110px;"></div>
    <details style="flex:1;"><summary>Priority weights (shared)</summary>
      <div class="row" style="margin-top:8px;">
        <div class="field"><label>High</label><input type="number" id="wHigh" value="${STRATEGY_SETTINGS.weights.High}" style="width:55px;"></div>
        <div class="field"><label>Medium</label><input type="number" id="wMedium" value="${STRATEGY_SETTINGS.weights.Medium}" style="width:55px;"></div>
        <div class="field"><label>Low</label><input type="number" id="wLow" value="${STRATEGY_SETTINGS.weights.Low}" style="width:55px;"></div>
        <button class="btn secondary sm" id="saveWeightsBtn">Save weights</button>
      </div>
    </details>`;
  wrap.appendChild(controls);
  const tableWrap = document.createElement("div"); wrap.appendChild(tableWrap);
  const addBtn = document.createElement("button"); addBtn.className = "btn secondary sm"; addBtn.style.marginTop="10px"; addBtn.textContent="+ Add activity";
  addBtn.addEventListener("click", ()=>{ currentStrategy.activities.push({activity:"", priority:"Medium", month:monthKey, lever:"", noCost:false}); renderActivityTable(); });
  wrap.appendChild(addBtn);

  function renderActivityTable(){
    tableWrap.innerHTML = "";
    const budget = parseFloat(el("planBudget")?.value ?? budgetRaw) || 0;
    const w = STRATEGY_SETTINGS.weights;
    const rowsInMonth = currentStrategy.activities.filter(r=>r.month===monthKey && !r.noCost);
    const totalWeight = rowsInMonth.reduce((s,r)=>s+(w[r.priority]||0),0) || 1;
    const table = document.createElement("table"); table.className = "rep";
    table.innerHTML = `<tr><th>Activity</th><th style="width:100px;">Priority</th><th style="width:75px;">Month</th><th style="width:120px;">Lever</th><th style="width:75px;">No cost</th><th style="width:100px;">Allocated</th><th></th></tr>`;
    currentStrategy.activities.forEach((row,i)=>{
      const tr = document.createElement("tr");
      const inMonth = row.month===monthKey;
      const allocated = (inMonth && !row.noCost) ? Math.round(budget*(w[row.priority]||0)/totalWeight) : null;
      tr.innerHTML = `
        <td><input type="text" list="sharedTagsList" value="${row.activity||""}" data-i="${i}" data-f="activity" placeholder="e.g. Google Hotel Ads"></td>
        <td><select data-i="${i}" data-f="priority">${ACTIVITY_PRIORITY_OPTIONS.map(o=>`<option value="${o}" ${row.priority===o?"selected":""}>${o}</option>`).join("")}</select></td>
        <td><select data-i="${i}" data-f="month">${MONTH_OPTIONS.map(m=>`<option value="${m[0]}" ${row.month===m[0]?"selected":""}>${m[1]}</option>`).join("")}</select></td>
        <td><select data-i="${i}" data-f="lever"><option value="">—</option>${LEVERS.map(l=>`<option value="${l}" ${row.lever===l?"selected":""}>${l}</option>`).join("")}</select></td>
        <td style="text-align:center;"><input type="checkbox" data-i="${i}" data-f="noCost" ${row.noCost?"checked":""}></td>
        <td>${allocated!==null?"$"+allocated:(row.noCost?"no cost":(inMonth?"$0":"—"))}</td>
        <td><button class="rep-remove" data-i="${i}">✕</button></td>`;
      table.appendChild(tr);
    });
    tableWrap.appendChild(table);
    table.querySelectorAll("input,select").forEach(inp=>{
      const eventName = inp.type==="checkbox" ? "change" : (inp.tagName==="SELECT" ? "change" : "input");
      inp.addEventListener(eventName, async ()=>{
        const row = currentStrategy.activities[inp.dataset.i];
        row[inp.dataset.f] = inp.type==="checkbox" ? inp.checked : inp.value;
        if(inp.dataset.f==="activity" && inp.value.trim()) await addSharedTag(inp.value.trim());
        renderActivityTable();
      });
    });
    table.querySelectorAll(".rep-remove").forEach(btn=> btn.addEventListener("click", ()=>{ currentStrategy.activities.splice(btn.dataset.i,1); renderActivityTable(); }));
  }
  setTimeout(()=>{
    el("planBudget").addEventListener("input", renderActivityTable);
    el("saveWeightsBtn").addEventListener("click", async ()=>{
      STRATEGY_SETTINGS.weights.High = +el("wHigh").value;
      STRATEGY_SETTINGS.weights.Medium = +el("wMedium").value;
      STRATEGY_SETTINGS.weights.Low = +el("wLow").value;
      await saveStrategySettings(); renderActivityTable();
    });
    renderActivityTable();
  },0);
  return wrap;
}

/* =========================================================
   MODULE: PROGRESS (flat cards, board by stage)
========================================================= */
const STAGES = ["Idea","Planned","In Preparation","Live","Done/Paused"];
function blankProgress(){ return { cards: [], ideas: [], generalNotes: [] }; }
let currentProgress = null;
let progressExpanded = {};
let progressFilterTag = "";

async function loadProgress(hotelId){
  try{ const res = await stGet(`dmh-progress:${hotelId}`, true); if(res && res.value) return JSON.parse(res.value); } catch(e){}
  return null;
}
async function saveProgress(){ if(!currentHotel) return; await stSet(`dmh-progress:${currentHotel.id}`, JSON.stringify(currentProgress), true); }
async function ensureProgressLoaded(){
  if(!currentProgress || currentProgress._hotelId !== currentHotel.id){
    const loaded = await loadProgress(currentHotel.id);
    currentProgress = loaded || blankProgress();
    if(!currentProgress.cards) currentProgress.cards = [];
    if(!currentProgress.ideas) currentProgress.ideas = [];
    if(!currentProgress.generalNotes) currentProgress.generalNotes = [];
    currentProgress._hotelId = currentHotel.id;
    progressExpanded = {};
  }
}

async function renderProgressTab(){
  const root = el("tabProgress");
  root.innerHTML = "";
  if(!currentHotel){ root.innerHTML = '<div class="empty-state">Select a hotel above.</div>'; return; }
  await ensureProgressLoaded();

  const topRow = document.createElement("div"); topRow.className = "card";
  topRow.innerHTML = `<div class="row" style="align-items:flex-start;">
    <div class="field" style="flex:1;"><label>Filter by tag (click to filter, or add a new one)</label>
      <div id="progFilterTags" class="tag-group"></div>
    </div>
    <button class="btn" id="addCardBtn">+ Add card</button>
    <span class="status-text" id="progSaveStatus"></span>
  </div>`;
  root.appendChild(topRow);

  const filterTagsWrap = el("progFilterTags");
  const allOption = document.createElement("div");
  allOption.className = "tag" + (progressFilterTag==="" ? " selected" : "");
  allOption.textContent = "All";
  allOption.addEventListener("click", ()=>{ progressFilterTag = ""; renderProgressTab(); });
  filterTagsWrap.appendChild(allOption);
  sharedTags.forEach(t=>{
    const tag = document.createElement("div");
    tag.className = "tag" + (progressFilterTag===t ? " selected" : "");
    tag.textContent = t;
    tag.addEventListener("click", ()=>{ progressFilterTag = (progressFilterTag===t ? "" : t); renderProgressTab(); });
    filterTagsWrap.appendChild(tag);
  });
  const addTagWrap = document.createElement("div"); addTagWrap.className = "tag-add"; addTagWrap.style.marginTop = "6px";
  addTagWrap.innerHTML = `<input type="text" id="newFilterTagInput" placeholder="Add new tag..."><button class="btn secondary sm" id="addFilterTagBtn">Add</button>`;
  el("progFilterTags").insertAdjacentElement("afterend", addTagWrap);
  el("addFilterTagBtn").addEventListener("click", async ()=>{
    const val = el("newFilterTagInput").value.trim();
    if(!val) return;
    await addSharedTag(val);
    progressFilterTag = val;
    renderProgressTab();
  });

  const manageTagsDetails = document.createElement("details"); manageTagsDetails.style.marginTop = "10px";
  manageTagsDetails.innerHTML = `<summary>Manage tags (rename or remove — renaming updates every card, activity, and result already using it)</summary>`;
  const manageTagsBody = document.createElement("div"); manageTagsBody.style.marginTop = "8px";
  sharedTags.forEach(tag=>{
    const row = document.createElement("div"); row.className = "manage-row";
    row.innerHTML = `<input type="text" value="${tag}" style="flex:1;">
      <button class="btn secondary sm rename-tag">Rename</button>
      <button class="btn danger sm remove-tag">Remove</button>`;
    row.querySelector(".rename-tag").addEventListener("click", async ()=>{
      const newVal = row.querySelector("input").value.trim();
      manageTagsStatus.textContent = "Updating...";
      const result = await renameSharedTag(tag, newVal);
      if(progressFilterTag === tag) progressFilterTag = newVal;
      manageTagsStatus.textContent = result.changed ? `Renamed — updated ${result.updatedRecords} hotel record(s).` : "No change.";
      await ensureProgressLoaded();
      renderProgressTab();
    });
    row.querySelector(".remove-tag").addEventListener("click", async ()=>{
      if(!confirm(`Remove "${tag}" from the shared tag list? Cards or entries that already used it will keep it as-is — this only removes it from the picker.`)) return;
      await removeSharedTag(tag);
      if(progressFilterTag === tag) progressFilterTag = "";
      renderProgressTab();
    });
    manageTagsBody.appendChild(row);
  });
  const manageTagsStatus = document.createElement("div"); manageTagsStatus.className = "status-text"; manageTagsStatus.style.marginTop = "6px";
  manageTagsDetails.appendChild(manageTagsBody);
  manageTagsDetails.appendChild(manageTagsStatus);
  topRow.querySelector(".row").insertAdjacentElement("afterend", manageTagsDetails);

  el("addCardBtn").addEventListener("click", async ()=>{
    try{
      const c = {id:"card-"+Date.now(), title:"New activity", tags: progressFilterTag ? [progressFilterTag] : [], period:"", stage:"Idea", subtasks:[], notes:""};
      currentProgress.cards.push(c);
      await saveProgress();
      progressExpanded[c.id] = true;
      el("progSaveStatus").textContent = "";
      renderProgressTab();
    } catch(err){
      el("progSaveStatus").textContent = "Error adding card: " + err.message;
    }
  });

  const board = document.createElement("div"); board.className = "board";
  STAGES.forEach(stage=>{
    const col = document.createElement("div"); col.className = "board-col";
    col.innerHTML = `<div class="board-col-title">${stage}</div>`;
    const cardsInStage = currentProgress.cards.filter(c=> c.stage===stage && (!progressFilterTag || (c.tags||[]).includes(progressFilterTag)));
    cardsInStage.forEach(c=>{
      const cardEl = document.createElement("div"); cardEl.className = "p-card";
      cardEl.innerHTML = `
        <div class="p-card-title">${c.title||"(untitled)"}</div>
        <div class="p-card-meta">${c.period||"no period set"}</div>
        <div class="p-card-tags">${(c.tags||[]).map(t=>`<span class="p-tag">${t}</span>`).join("")}</div>`;
      cardEl.addEventListener("click", ()=>{ progressExpanded[c.id] = !progressExpanded[c.id]; renderProgressTab(); });
      col.appendChild(cardEl);
    });
    board.appendChild(col);
  });
  root.appendChild(board);

  const expandedCards = currentProgress.cards.filter(c=>progressExpanded[c.id]);
  expandedCards.forEach(c=> root.appendChild(renderCardDetail(c)));

  const ideasCard = document.createElement("div"); ideasCard.className = "card";
  ideasCard.innerHTML = `<div class="card-title">Future ideas</div>`;
  currentProgress.ideas.forEach((idea,i)=>{
    const row = document.createElement("div"); row.className = "idea-item";
    row.innerHTML = `<input type="text" value="${idea.text||""}" data-i="${i}" style="flex:2;">
      <input type="text" list="sharedTagsList" value="${idea.tags||""}" data-i="${i}" data-f="tags" placeholder="tags, comma-separated" style="flex:1;">
      <button class="btn secondary sm move-idea" data-i="${i}">Move to plan</button>
      <button class="rep-remove" data-i="${i}" data-del="1">✕</button>`;
    ideasCard.appendChild(row);
  });
  const addIdeaBtn = document.createElement("button"); addIdeaBtn.className = "btn secondary sm"; addIdeaBtn.style.marginTop="8px";
  addIdeaBtn.textContent = "+ Add idea";
  addIdeaBtn.addEventListener("click", async ()=>{ currentProgress.ideas.push({text:"", tags:""}); await saveProgress(); renderProgressTab(); });
  ideasCard.appendChild(addIdeaBtn);
  root.appendChild(ideasCard);

  ideasCard.querySelectorAll("input[type=text]").forEach(inp=>{
    inp.addEventListener("input", async ()=>{
      const i = inp.dataset.i;
      if(inp.dataset.f==="tags") currentProgress.ideas[i].tags = inp.value; else currentProgress.ideas[i].text = inp.value;
    });
  });
  ideasCard.querySelectorAll(".move-idea").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const idea = currentProgress.ideas[btn.dataset.i];
      const tags = (idea.tags||"").split(",").map(s=>s.trim()).filter(Boolean);
      for(const t of tags) await addSharedTag(t);
      currentProgress.cards.push({id:"card-"+Date.now(), title:idea.text||"(from idea)", tags, period:"", stage:"Planned", subtasks:[], notes:""});
      currentProgress.ideas.splice(btn.dataset.i,1);
      await saveProgress(); renderProgressTab();
    });
  });
  ideasCard.querySelectorAll(".rep-remove").forEach(btn=>{
    btn.addEventListener("click", async ()=>{ currentProgress.ideas.splice(btn.dataset.i,1); await saveProgress(); renderProgressTab(); });
  });

  const notesCard = document.createElement("div"); notesCard.className = "card";
  notesCard.innerHTML = `<div class="card-title">General notes & links</div>`;
  notesCard.appendChild(renderTable(
    { columns:[
        {key:"note", label:"What was done", type:"text"},
        {key:"link", label:"Link (screenshot, doc, page)", type:"text"},
        {key:"date", label:"Date", type:"date"},
      ], addLabel:"+ Add note" },
    currentProgress.generalNotes,
    async ()=>{ await saveProgress(); renderProgressTab(); }
  ));
  const saveNotesBtn = document.createElement("button"); saveNotesBtn.className = "btn secondary sm"; saveNotesBtn.style.marginTop="8px"; saveNotesBtn.textContent = "Save notes";
  saveNotesBtn.addEventListener("click", saveProgress);
  notesCard.appendChild(saveNotesBtn);
  root.appendChild(notesCard);
}

function renderCardDetail(c){
  const wrap = document.createElement("div"); wrap.className = "p-detail";
  wrap.innerHTML = `<div class="row">
    <div class="field" style="flex:2;"><label>Title</label><input type="text" list="sharedTagsList" id="cd-title-${c.id}" value="${c.title||""}"></div>
    <div class="field"><label>Period</label><input type="text" id="cd-period-${c.id}" value="${c.period||""}" placeholder="e.g. Jul 2026"></div>
    <div class="field"><label>Stage</label><select id="cd-stage-${c.id}">${STAGES.map(s=>`<option value="${s}" ${c.stage===s?"selected":""}>${s}</option>`).join("")}</select></div>
    <button class="btn danger sm" id="cd-delete-${c.id}">Delete card</button>
  </div>`;
  const tagGroupWrap = document.createElement("div"); tagGroupWrap.className = "group-block"; tagGroupWrap.innerHTML = `<div class="group-label">Tags</div>`;
  tagGroupWrap.appendChild(renderTagGroup(
    { key:"tags", label:"", extendable:true, options: sharedTags },
    c.tags,
    ()=>renderProgressTab(),
    async ()=>{}
  ));
  wrap.appendChild(tagGroupWrap);

  const subWrap = document.createElement("div"); subWrap.className = "group-block"; subWrap.innerHTML = `<div class="group-label">Subtasks</div>`;
  c.subtasks.forEach((st,i)=>{
    const row = document.createElement("div"); row.className = "subtask-row";
    row.innerHTML = `<input type="checkbox" data-i="${i}" data-f="done" ${st.done?"checked":""}>
      <input type="text" class="task" data-i="${i}" data-f="text" value="${st.text||""}" placeholder="subtask...">

      <button class="rep-remove" data-i="${i}">✕</button>`;
    subWrap.appendChild(row);
  });
  const addSubBtn = document.createElement("button"); addSubBtn.className = "btn secondary sm"; addSubBtn.style.marginTop="6px"; addSubBtn.textContent = "+ Add subtask";
  addSubBtn.addEventListener("click", async ()=>{ c.subtasks.push({text:"",done:false,link:""}); await saveProgress(); renderProgressTab(); });
  subWrap.appendChild(addSubBtn);
  wrap.appendChild(subWrap);

  const notesWrap = document.createElement("div"); notesWrap.className = "group-block"; notesWrap.innerHTML = `<div class="group-label">Notes</div>`;
  const notesArea = document.createElement("textarea"); notesArea.value = c.notes||"";
  notesArea.addEventListener("input", ()=>{ c.notes = notesArea.value; });
  notesWrap.appendChild(notesArea);
  wrap.appendChild(notesWrap);

  const saveBtnRow = document.createElement("div"); saveBtnRow.className = "row"; saveBtnRow.style.marginTop="10px";
  saveBtnRow.innerHTML = `<button class="btn secondary sm cd-save">Save card</button>`;
  wrap.appendChild(saveBtnRow);

  setTimeout(()=>{
    document.getElementById(`cd-title-${c.id}`).addEventListener("input", async e=>{ c.title = e.target.value; await addSharedTag(e.target.value.trim()); });
    document.getElementById(`cd-period-${c.id}`).addEventListener("input", e=>{ c.period = e.target.value; });
    document.getElementById(`cd-stage-${c.id}`).addEventListener("change", async e=>{ c.stage = e.target.value; await saveProgress(); renderProgressTab(); });
    document.getElementById(`cd-delete-${c.id}`).addEventListener("click", async ()=>{
      if(!confirm("Delete this card?")) return;
      currentProgress.cards = currentProgress.cards.filter(x=>x.id!==c.id);
      await saveProgress(); renderProgressTab();
    });
    wrap.querySelectorAll(".subtask-row input").forEach(inp=>{
      const evt = inp.type==="checkbox" ? "change" : "input";
      inp.addEventListener(evt, ()=>{ c.subtasks[inp.dataset.i][inp.dataset.f] = inp.type==="checkbox" ? inp.checked : inp.value; });
    });
    wrap.querySelectorAll(".subtask-row .rep-remove").forEach(btn=>{
      btn.addEventListener("click", async ()=>{ c.subtasks.splice(btn.dataset.i,1); await saveProgress(); renderProgressTab(); });
    });
    wrap.querySelector(".cd-save").addEventListener("click", async ()=>{ await saveProgress(); });
  },0);

  return wrap;
}

   MODULE: RESULTS

function blankResults(){ return { periods: [] }; }
let currentResults = null;
let activePeriodLabel = null;

async function loadResults(hotelId){
  try{ const res = await stGet(`dmh-results:${hotelId}`, true); if(res && res.value) return JSON.parse(res.value); } catch(e){}
  return null;
}
async function saveResults(){ if(!currentHotel) return; await stSet(`dmh-results:${currentHotel.id}`, JSON.stringify(currentResults), true); }
async function ensureResultsLoaded(){
  if(!currentResults || currentResults._hotelId !== currentHotel.id){

async function renderResultsTab(){

  visCard.innerHTML = `<div class="card-title">Visibility metrics (not tied to spend)</div>`;
  visCard.appendChild(renderTable(
    { columns:[ {key:"name", label:"Metric", type:"text"}, {key:"value", label:"Value", type:"text"} ], addLabel:"+ Add metric" },
    periodObj.visibilityMetrics, ()=>renderResultsTab()
  ));
  root.appendChild(visCard);

  const savePeriodBtn = document.createElement("button"); savePeriodBtn.className = "btn"; savePeriodBtn.textContent = "Save period";
  savePeriodBtn.addEventListener("click", async ()=>{
    el("resultsStatus").textContent = "Saving...";
    try{ await saveResults(); el("resultsStatus").textContent = "Saved " + new Date().toLocaleTimeString('en-US'); }
    catch(err){ el("resultsStatus").textContent = "⚠ Save failed: " + err.message; }
  });
  root.appendChild(savePeriodBtn);
}

/* =========================================================
   INIT
========================================================= */
(async function init(){
  el("globalStatus").textContent = "Loading workspace...";
  try{
    await Promise.all([loadSchema(), loadStrategySettings(), loadHotelIndex(), loadSharedTags()]);
    populateHotelSelect();
    const warnings = [loadSchemaWarning, loadHotelIndexWarning, loadSharedTagsWarning].filter(Boolean);
    el("globalStatus").textContent = warnings.length ? "⚠ " + warnings.join(" · ") : "";
    renderActiveTab();
  } catch(err){
    el("hotelSelect").innerHTML = '<option value="">(failed to load)</option>';
    el("globalStatus").innerHTML = `⚠ Could not load the workspace: ${err.message} — <button class="btn secondary sm" onclick="location.reload()">Retry</button>`;
  }
})();
</script>
</body>
</html>
