<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DMH Hotel Report</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --brand:#4D1774;        /* Exely primary — deep purple */
    --brand-dark:#2E0D45;   /* darkest purple — main text */
    --accent:#F65925;       /* Exely accent — orange */
    --accent2:#C022FF;      /* Exely secondary — magenta */
    --paper:#EEECF4;        /* light lavender background */
    --card:#FFFFFF;
    --ink:#2E0D45;
    --ink-soft:#7A6690;
    --line:#DDD5E8;
    --brand-soft:#F1E9F7;
    --accent-soft:#FDE7DE;
    --slate-soft:#F4F2F8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;}
  .shell{max-width:860px;margin:0 auto;padding:22px 26px 60px;}

  .controls{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:20px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;}
  select, input[type=text]{font-family:'IBM Plex Sans',sans-serif;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:13px;}
  .btn{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:12.5px;border-radius:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;padding:8px 14px;cursor:pointer;}
  .btn.secondary{background:#fff;color:var(--brand);}
  .btn.accent{background:var(--accent);border-color:var(--accent);}
  .status-text{font-size:11.5px;color:var(--ink-soft);}
  .tag-group{display:flex;flex-wrap:wrap;gap:7px;}
  .tag{font-size:12px;padding:6px 11px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink-soft);}
  .tag.selected{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
  .toggle-row{display:flex;align-items:center;gap:8px;font-size:12.5px;}

  /* Report */
  .report{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 0 40px;overflow:hidden;box-shadow:0 1px 3px rgba(46,13,69,.06);}
  .report-header{background:linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);color:#fff;padding:30px 40px 26px;}
  .report-kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:8px;}
  .report-title{font-family:'Fraunces',serif;font-size:28px;font-weight:700;margin:0 0 4px;color:#fff;}
  .report-sub{font-size:13px;opacity:.9;}
  .report-body{padding:32px 40px 0;}
  .section{margin-bottom:30px;}
  .section-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:0 0 14px;color:var(--brand);position:relative;padding-left:14px;}
  .section-title::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:4px;background:var(--accent);border-radius:3px;}
  .glance-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:8px;}
  .glance-item{background:var(--brand-soft);border-radius:12px;padding:16px 18px;text-align:center;}
  .glance-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand);font-weight:600;margin-bottom:6px;}
  .glance-val{font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:var(--brand-dark);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .delta-badge{font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;padding:3px 10px;border-radius:8px;vertical-align:middle;}
  .delta-badge.delta-up{background:var(--accent-soft);color:#8A3A18;}
  .delta-badge.delta-down{background:#E9E4EE;color:var(--ink-soft);}
  .kpi .delta-badge{font-size:11px;padding:1px 6px;border-radius:6px;margin-left:4px;}
  .compare-chart{margin-bottom:26px;}
  .compare-row{display:grid;grid-template-columns:80px 1fr 40px;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;}
  .compare-bars{display:flex;flex-direction:column;gap:3px;}
  .compare-bar-track{background:var(--slate-soft);border-radius:4px;height:14px;overflow:hidden;position:relative;}
  .compare-bar-fill{height:100%;border-radius:4px;}
  .compare-bar-fill.prev{background:var(--line);}
  .compare-bar-fill.curr{background:var(--brand);}
  .compare-legend{display:flex;gap:16px;font-size:11px;color:var(--ink-soft);margin-bottom:10px;}
  .compare-legend span{display:flex;align-items:center;gap:5px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
  .kpi{background:var(--slate-soft);border-radius:10px;padding:14px 16px;border:1px solid var(--line);}
  .kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;}
  .kpi-val{font-family:'Fraunces',serif;font-size:24px;font-weight:700;margin-top:4px;color:var(--brand);}
  .kpi-val.accent{color:var(--accent);}
  table.rtable{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px;}
  table.rtable th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);text-align:left;padding:7px 8px;border-bottom:2px solid var(--brand-soft);}
  table.rtable td{padding:8px;border-bottom:1px solid var(--slate-soft);}

  .activity-card{background:var(--slate-soft);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
  .activity-title{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--brand-dark);}
  .activity-meta{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .activity-meta .pill{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:600;border-radius:9px;padding:1px 8px;margin-right:4px;font-size:10.5px;}
  .activity-result{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;margin-top:10px;font-size:12.5px;}
  .activity-result .result-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700;margin-bottom:2px;}
  .activity-media{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;}
  .activity-media img{max-width:220px;max-height:150px;border-radius:8px;border:1px solid var(--line);object-fit:cover;}
  .activity-media a.file-link{font-size:12px;color:var(--brand);text-decoration:none;background:var(--brand-soft);padding:6px 10px;border-radius:6px;display:inline-block;}

  .season-note{background:var(--accent-soft);color:#8A3A18;border-radius:8px;padding:10px 14px;font-size:12.5px;}
  .empty-note{color:var(--ink-soft);font-size:12.5px;font-style:italic;}

  @media (max-width:600px){
    .glance-strip{grid-template-columns:1fr;}
  }

  @media print{
    body{background:#fff;}
    .controls, .no-print{display:none !important;}
    .report{border:none;padding:0;box-shadow:none;border-radius:0;}
    .report-header{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .shell{max-width:100%;padding:0;}
  }
</style>
</head>
<body>
<div class="shell">

  <div class="controls no-print">
    <div class="row">
      <div class="field" style="min-width:220px;">
        <label>Hotel</label>
        <select id="hotelSelect"><option value="">Loading...</option></select>
      </div>
      <button class="btn secondary" id="loadBtn">Load data</button>
      <button class="btn" id="printBtn">Print / Export</button>
      <span class="status-text" id="statusText"></span>
    </div>
    <div class="row" style="margin-top:12px;">
      <div class="field" style="flex:1;">
        <label>Periods to include</label>
        <div class="tag-group" id="periodPicker"></div>
      </div>
      <div class="field">
        <label>Costs</label>
        <div class="toggle-row"><input type="checkbox" id="showSpendToggle"> <label for="showSpendToggle" style="text-transform:none;font-weight:400;">Show spend &amp; ROAS</label></div>
      </div>
    </div>
  </div>

  <div id="reportRoot"></div>

</div>

<script>
const SHEETS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxKHZNNI6QlVeyv9Q982-ErEYSXkIdD6vTt0Lpq5z2YMCA_-cR1KROjWjM_p_tzolDSVw/exec";
const el = id => document.getElementById(id);

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error(`Timed out waiting for ${label} (no response after ${ms/1000}s)`)), ms))
  ]);
}
function checkBackendConfigured(){
  if(!SHEETS_WEBAPP_URL || SHEETS_WEBAPP_URL.indexOf("PASTE_YOUR") === 0){
    throw new Error("Backend not configured — paste the same Apps Script URL used in the main workspace into SHEETS_WEBAPP_URL near the top of this file.");
  }
}
async function stGet(key){
  checkBackendConfigured();
  const res = await withTimeout(fetch(`${SHEETS_WEBAPP_URL}?key=${encodeURIComponent(key)}`), 12000, `loading "${key}"`);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.value;
}

let hotelIndex = [];
let currentHotel = null;
let currentResults = null;
let currentProgress = null;
let selectedPeriods = new Set();

async function loadHotelIndex(){
  try{ hotelIndex = JSON.parse(await stGet("dmh-hotel-index")); } catch(e){ hotelIndex = []; }
}
function populateHotelSelect(){
  const sel = el("hotelSelect");
  sel.innerHTML = '<option value="">Select a hotel...</option>';
  hotelIndex.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(h=>{
    const opt = document.createElement("option"); opt.value = h.id; opt.textContent = h.name; sel.appendChild(opt);
  });
}

async function loadAllForHotel(id){
  el("statusText").textContent = "Loading...";
  try{
    currentHotel = JSON.parse(await stGet(`dmh-hotel:${id}`));
  } catch(e){ currentHotel = null; }
  try{
    currentResults = JSON.parse(await stGet(`dmh-results:${id}`));
  } catch(e){ currentResults = { periods: [] }; }
  try{
    currentProgress = JSON.parse(await stGet(`dmh-progress:${id}`));
  } catch(e){ currentProgress = { cards: [] }; }
  selectedPeriods = new Set((currentResults.periods||[]).map(p=>p.period));
  el("statusText").textContent = "Loaded " + new Date().toLocaleTimeString('en-US');
  renderPeriodPicker();
  renderReport();
}

function getField(sectionId, key){ return currentHotel?.sections?.[sectionId]?.fields?.[key] || ""; }

function renderPeriodPicker(){
  const wrap = el("periodPicker");
  wrap.innerHTML = "";
  const periods = currentResults?.periods || [];
  if(periods.length === 0){ wrap.innerHTML = '<span class="status-text">No periods logged for this hotel.</span>'; return; }
  periods.forEach(p=>{
    const tag = document.createElement("div");
    tag.className = "tag" + (selectedPeriods.has(p.period) ? " selected" : "");
    tag.textContent = p.period;
    tag.addEventListener("click", ()=>{
      if(selectedPeriods.has(p.period)) selectedPeriods.delete(p.period); else selectedPeriods.add(p.period);
      renderPeriodPicker();
      renderReport();
    });
    wrap.appendChild(tag);
  });
}

function renderReport(){
  const root = el("reportRoot");
  root.innerHTML = "";
  if(!currentHotel){ root.innerHTML = '<div class="empty-note">Select a hotel and click Load data.</div>'; return; }

  const showSpend = el("showSpendToggle").checked;
  const periods = (currentResults.periods||[]).filter(p=>selectedPeriods.has(p.period));
  const allRows = periods.flatMap(p=>p.rows||[]);
  const allVisMetrics = periods.flatMap(p=>p.visibilityMetrics||[]);
  const seasonalNotes = periods.map(p=>p.seasonalNote).filter(Boolean);

  const totals = allRows.reduce((acc,r)=>({
    spend: acc.spend+(r.spend||0), traffic: acc.traffic+(r.traffic||0), bookings: acc.bookings+(r.bookings||0), revenue: acc.revenue+(r.revenue||0)
  }), {spend:0,traffic:0,bookings:0,revenue:0});
  const roas = totals.spend>0 ? (totals.revenue/totals.spend).toFixed(2) : "—";

  // Compare against the period right before the earliest selected one, so the
  // reader sees "up/down vs last time" instead of only a flat snapshot.
  const allPeriods = currentResults.periods || [];
  const selectedIndexes = periods.map(p => allPeriods.findIndex(x=>x.period===p.period)).filter(i=>i>=0);
  const earliestSelectedIndex = selectedIndexes.length ? Math.min(...selectedIndexes) : -1;
  const previousPeriod = earliestSelectedIndex > 0 ? allPeriods[earliestSelectedIndex-1] : null;
  const prevTotals = previousPeriod ? (previousPeriod.rows||[]).reduce((acc,r)=>({
    spend: acc.spend+(r.spend||0), traffic: acc.traffic+(r.traffic||0), bookings: acc.bookings+(r.bookings||0), revenue: acc.revenue+(r.revenue||0)
  }), {spend:0,traffic:0,bookings:0,revenue:0}) : null;

  function pctDelta(curr, prev){
    if(prev===null || prev===undefined || prev===0) return null;
    return ((curr-prev)/prev*100);
  }
  function deltaBadge(curr, prev, goodWhenUp=true){
    const d = pctDelta(curr, prev);
    if(d === null) return "";
    const up = d >= 0;
    const positive = goodWhenUp ? up : !up;
    const cls = positive ? "delta-up" : "delta-down";
    const arrow = up ? "▲" : "▼";
    return `<span class="delta-badge ${cls}">${arrow} ${Math.abs(d).toFixed(0)}%</span>`;
  }

  const report = document.createElement("div");
  report.className = "report";

  const periodLabel = periods.length ? periods.map(p=>p.period).join(", ") : "no period selected";
  report.innerHTML += `
    <div class="report-header">
      <div class="report-kicker">Exely Digital Marketing Hub</div>
      <div class="report-title">${getField("hotelData","name") || currentHotel.id}</div>
      <div class="report-sub">${periodLabel}</div>
    </div>`;
  const bodyWrap = document.createElement("div"); bodyWrap.className = "report-body";
  report.appendChild(bodyWrap);

  // Activities completed this period — moved up so it can join the glance strip
  const doneCards = (currentProgress.cards||[]).filter(c=>
    selectedPeriods.has(c.period) && (c.stage==="Done/Paused" || c.stage==="Live")
  );
  const prevActivitiesCount = previousPeriod
    ? (currentProgress.cards||[]).filter(c=> c.period===previousPeriod.period && (c.stage==="Done/Paused" || c.stage==="Live")).length
    : null;

  // At a glance — three co-equal figures, so a dip in one doesn't read as
  // "everything failed." Revenue here is only what's attributed to tracked
  // marketing activity, not the hotel's total direct revenue.
  const glance = document.createElement("div"); glance.className = "glance-strip";
  glance.innerHTML = `
    <div class="glance-item">
      <div class="glance-label">Revenue from tracked campaigns</div>
      <div class="glance-val">$${totals.revenue} ${deltaBadge(totals.revenue, prevTotals?.revenue)}</div>
    </div>
    <div class="glance-item">
      <div class="glance-label">Traffic reached</div>
      <div class="glance-val">${totals.traffic} ${deltaBadge(totals.traffic, prevTotals?.traffic)}</div>
    </div>
    <div class="glance-item">
      <div class="glance-label">Activities completed</div>
      <div class="glance-val">${doneCards.length} ${deltaBadge(doneCards.length, prevActivitiesCount)}</div>
    </div>
  `;
  bodyWrap.appendChild(glance);
  if(!previousPeriod){
    const note = document.createElement("div"); note.className = "empty-note"; note.style.textAlign = "center"; note.style.marginTop = "-14px"; note.style.marginBottom = "18px";
    bodyWrap.appendChild(note);
  }

  if(previousPeriod){
    bodyWrap.appendChild(buildComparisonChart([
      {label:"Traffic", curr:totals.traffic, prev:prevTotals.traffic},
      {label:"Bookings", curr:totals.bookings, prev:prevTotals.bookings},
      {label:"Revenue", curr:totals.revenue, prev:prevTotals.revenue},
    ], previousPeriod.period, periodLabel));
  }

  // Results section
  const resultsSection = document.createElement("div"); resultsSection.className = "section";
  const kpiGrid = document.createElement("div"); kpiGrid.className = "kpi-grid";
  kpiGrid.innerHTML = `
    <div class="kpi"><div class="kpi-label">Traffic</div><div class="kpi-val">${totals.traffic} ${deltaBadge(totals.traffic, prevTotals?.traffic)}</div></div>
    <div class="kpi"><div class="kpi-label">Bookings</div><div class="kpi-val accent">${totals.bookings} ${deltaBadge(totals.bookings, prevTotals?.bookings)}</div></div>
    ${showSpend ? `<div class="kpi"><div class="kpi-label">Marketing spend</div><div class="kpi-val">$${totals.spend} ${deltaBadge(totals.spend, prevTotals?.spend, false)}</div></div>
    <div class="kpi"><div class="kpi-label">Return on spend</div><div class="kpi-val accent">${roas}×</div></div>` : ""}
  `;
  resultsSection.innerHTML = `<div class="section-title">Results in detail</div>`;
  resultsSection.appendChild(kpiGrid);

  if(allRows.length){
    const byCampaign = {};
    allRows.forEach(r=>{
      const name = r.campaign && r.campaign.trim() ? r.campaign.trim() : (r.channel && r.channel.trim() ? r.channel.trim() : "Other");
      if(!byCampaign[name]) byCampaign[name] = {traffic:0,bookings:0,revenue:0,spend:0,channel:r.channel||""};
      byCampaign[name].traffic += r.traffic||0; byCampaign[name].bookings += r.bookings||0;
      byCampaign[name].revenue += r.revenue||0; byCampaign[name].spend += r.spend||0;
    });
    const table = document.createElement("table"); table.className = "rtable";
    table.innerHTML = `<tr><th>Campaign</th><th>Traffic</th><th>Bookings</th><th>Revenue</th>${showSpend?"<th>Spend</th><th>ROAS</th>":""}</tr>` +
      Object.keys(byCampaign).sort((a,b)=>byCampaign[b].revenue-byCampaign[a].revenue).map(name=>{
        const c = byCampaign[name];
        const r = c.spend>0 ? (c.revenue/c.spend).toFixed(2)+"×" : "—";
        const channelNote = c.channel ? `<div style="font-size:10.5px;color:var(--ink-soft);">${c.channel}</div>` : "";
        return `<tr><td>${name}${channelNote}</td><td>${c.traffic}</td><td>${c.bookings}</td><td>$${c.revenue}</td>${showSpend?`<td>$${c.spend}</td><td>${r}</td>`:""}</tr>`;
      }).join("");
    resultsSection.appendChild(table);
  } else {
    resultsSection.innerHTML += `<div class="empty-note">No results logged for the selected period(s).</div>`;
  }
  bodyWrap.appendChild(resultsSection);

  // Visibility metrics
  if(allVisMetrics.length){
    const visSection = document.createElement("div"); visSection.className = "section";
    visSection.innerHTML = `<div class="section-title">Visibility</div>`;
    const table = document.createElement("table"); table.className = "rtable";
    table.innerHTML = `<tr><th>Metric</th><th>Value</th></tr>` +
      allVisMetrics.map(m=>`<tr><td>${m.name||""}</td><td>${m.value||""}</td></tr>`).join("");
    visSection.appendChild(table);
    bodyWrap.appendChild(visSection);
  }

  // What we did — from Progress cards in the selected periods
  const activitySection = document.createElement("div"); activitySection.className = "section";
  activitySection.innerHTML = `<div class="section-title">What we did</div>`;
  if(doneCards.length){
    doneCards.forEach(c=>{
      const item = document.createElement("div"); item.className = "activity-card";
      const tagPills = (c.tags||[]).map(t=>`<span class="pill">${t}</span>`).join("");
      item.innerHTML = `
        <div class="activity-title">${c.title||"(untitled)"}</div>
        <div class="activity-meta">${tagPills} ${c.period?("· "+c.period):""} ${c.stage==="Live"?"· ongoing":"· completed"}</div>
        ${c.notes ? `<div class="activity-result"><div class="result-label">Result</div>${c.notes}</div>` : ""}
      `;
      const linkedSubtasks = (c.subtasks||[]).filter(s=>s.link && s.link.trim());
      if(linkedSubtasks.length){
        const media = document.createElement("div"); media.className = "activity-media";
        linkedSubtasks.forEach(s=>{
          if(isImageUrl(s.link)){
            const img = document.createElement("img"); img.src = s.link; img.alt = s.text || "attachment";
            media.appendChild(img);
          } else {
            const a = document.createElement("a"); a.className = "file-link"; a.href = s.link; a.target = "_blank"; a.textContent = "🔗 " + (s.text || "View");
            media.appendChild(a);
          }
        });
        item.appendChild(media);
      }
      activitySection.appendChild(item);
    });
  } else {
    activitySection.innerHTML += `<div class="empty-note">No activities logged for the selected period(s) yet.</div>`;
  }
  bodyWrap.appendChild(activitySection);

  // Supporting materials — general notes & links (screenshots, docs) attached in Progress
  const generalNotes = (currentProgress.generalNotes || []).filter(n=>n.link && n.link.trim());
  if(generalNotes.length){
    const materialsSection = document.createElement("div"); materialsSection.className = "section";
    materialsSection.innerHTML = `<div class="section-title">Supporting materials</div>`;
    const media = document.createElement("div"); media.className = "activity-media";
    generalNotes.forEach(n=>{
      if(isImageUrl(n.link)){
        const img = document.createElement("img"); img.src = n.link; img.alt = n.note || "attachment";
        media.appendChild(img);
      } else {
        const a = document.createElement("a"); a.className = "file-link"; a.href = n.link; a.target = "_blank"; a.textContent = "🔗 " + (n.note || "View");
        media.appendChild(a);
      }
    });
    materialsSection.appendChild(media);
    bodyWrap.appendChild(materialsSection);
  }

  // Seasonal context
  if(seasonalNotes.length){
    const seasonSection = document.createElement("div"); seasonSection.className = "section";
    seasonSection.innerHTML = `<div class="section-title">Season context</div>` +
      seasonalNotes.map(n=>`<div class="season-note" style="margin-bottom:8px;">${n}</div>`).join("");
    bodyWrap.appendChild(seasonSection);
  }

  root.appendChild(report);
}

function buildComparisonChart(metrics, prevLabel, currLabel){
  const wrap = document.createElement("div"); wrap.className = "section compare-chart";
  wrap.innerHTML = `<div class="section-title">What changed vs last time</div>
    <div class="compare-legend">
      <span><span class="legend-dot" style="background:var(--line);"></span>${prevLabel}</span>
      <span><span class="legend-dot" style="background:var(--brand);"></span>${currLabel}</span>
    </div>`;
  metrics.forEach(m=>{
    const max = Math.max(m.curr, m.prev, 1);
    const row = document.createElement("div"); row.className = "compare-row";
    const pct = m.prev>0 ? Math.round((m.curr-m.prev)/m.prev*100) : null;
    row.innerHTML = `
      <div>${m.label}</div>
      <div class="compare-bars">
        <div class="compare-bar-track"><div class="compare-bar-fill prev" style="width:${(m.prev/max*100).toFixed(0)}%;"></div></div>
        <div class="compare-bar-track"><div class="compare-bar-fill curr" style="width:${(m.curr/max*100).toFixed(0)}%;"></div></div>
      </div>
      <div style="text-align:right;font-weight:600;color:${pct===null?'var(--ink-soft)':pct>=0?'#8A3A18':'var(--ink-soft)'};">${pct===null?"—":(pct>=0?"+":"")+pct+"%"}</div>
    `;
    wrap.appendChild(row);
  });
  return wrap;
}

function isImageUrl(url){
  return /\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(url.trim());
}

el("loadBtn").addEventListener("click", ()=>{
  const id = el("hotelSelect").value;
  if(!id) return;
  loadAllForHotel(id);
});
el("showSpendToggle").addEventListener("change", renderReport);
el("printBtn").addEventListener("click", ()=> window.print());

(async function init(){
  el("statusText").textContent = "Loading hotel list...";
  try{ await loadHotelIndex(); populateHotelSelect(); el("statusText").textContent = ""; }
  catch(e){ el("statusText").textContent = "⚠ " + e.message; }
})();
</script>
