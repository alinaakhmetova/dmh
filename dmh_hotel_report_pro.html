<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DMH Hotel Report — Pro (Retainer)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --brand:#4D1774;        /* Exely primary — deep purple */
    --brand-dark:#2E0D45;   /* darkest purple — main text */
    --accent:#F65925;       /* Exely accent — orange */
    --accent2:#C022FF;      /* Exely secondary — magenta */
    --paper:#EEECF4;        /* light lavender background */
    --card:#FFFFFF;
    --ink:#2E0D45;
    --ink-soft:#7A6690;
    --line:#DDD5E8;
    --brand-soft:#F1E9F7;
    --accent-soft:#FDE7DE;
    --slate-soft:#F4F2F8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;}
  .shell{max-width:860px;margin:0 auto;padding:22px 26px 60px;}

  .controls{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:20px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;}
  select, input[type=text]{font-family:'IBM Plex Sans',sans-serif;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:13px;}
  .btn{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:12.5px;border-radius:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;padding:8px 14px;cursor:pointer;}
  .btn.secondary{background:#fff;color:var(--brand);}
  .btn.accent{background:var(--accent);border-color:var(--accent);}
  .status-text{font-size:11.5px;color:var(--ink-soft);}
  .tag-group{display:flex;flex-wrap:wrap;gap:7px;}
  .tag{font-size:12px;padding:6px 11px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink-soft);}
  .tag.selected{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
  .toggle-row{display:flex;align-items:center;gap:8px;font-size:12.5px;}

  /* Report */
  .report{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 0 40px;overflow:hidden;box-shadow:0 1px 3px rgba(46,13,69,.06);}
  .report-header{background:linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);color:#fff;padding:30px 40px 26px;}
  .report-kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:8px;}
  .report-title{font-family:'Fraunces',serif;font-size:28px;font-weight:700;margin:0 0 4px;color:#fff;}
  .report-sub{font-size:13px;opacity:.9;}
  .report-body{padding:32px 40px 0;}
  .section{margin-bottom:30px;}
  .layer-heading{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600;margin:32px 0 16px;padding-bottom:8px;border-bottom:2px solid var(--accent-soft);}
  .layer-heading:first-of-type{margin-top:4px;}
  .section-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:0 0 14px;color:var(--brand);position:relative;padding-left:14px;}
  .group-sublabel{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;margin:14px 0 8px;}
  .group-sublabel:first-of-type{margin-top:0;}
  .section-title::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:4px;background:var(--accent);border-radius:3px;}
  .glance-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:8px;}
  .glance-item{background:var(--brand-soft);border-radius:12px;padding:16px 18px;text-align:center;}
  .glance-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand);font-weight:600;margin-bottom:6px;}
  .glance-val{font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:var(--brand-dark);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .glance-yoy{font-size:10.5px;color:var(--ink-soft);margin-top:6px;}
  .glance-yoy .delta-badge{font-size:11px;padding:1px 7px;border-radius:6px;}
  .delta-badge{font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;padding:3px 10px;border-radius:8px;vertical-align:middle;white-space:nowrap;display:inline-block;}
  .delta-badge.delta-up{background:var(--accent-soft);color:#8A3A18;}
  .delta-badge.delta-down{background:#E9E4EE;color:var(--ink-soft);}
  .kpi .delta-badge{font-size:11px;padding:1px 6px;border-radius:6px;margin-left:4px;}
  .compare-chart{margin-bottom:26px;}
  .compare-row{display:grid;grid-template-columns:80px 1fr 40px;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;}
  .compare-bars{display:flex;flex-direction:column;gap:3px;}
  .compare-bar-track{background:var(--slate-soft);border-radius:4px;height:14px;overflow:hidden;position:relative;}
  .compare-bar-fill{height:100%;border-radius:4px;}
  .compare-bar-fill.prev{background:var(--line);}
  .compare-bar-fill.curr{background:var(--brand);}
  .compare-legend{display:flex;gap:16px;font-size:11px;color:var(--ink-soft);margin-bottom:10px;}
  .compare-legend span{display:flex;align-items:center;gap:5px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
  .kpi{background:var(--slate-soft);border-radius:10px;padding:14px 16px;border:1px solid var(--line);}
  .kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;}
  .kpi-val{font-family:'Fraunces',serif;font-size:24px;font-weight:700;margin-top:4px;color:var(--brand);}
  .kpi-val.accent{color:var(--accent);}
  table.rtable{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px;}
  table.rtable th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);text-align:left;padding:7px 8px;border-bottom:2px solid var(--brand-soft);}
  table.rtable td{padding:8px;border-bottom:1px solid var(--slate-soft);}

  .activity-card{background:var(--slate-soft);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
  .activity-title{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--brand-dark);}
  .activity-meta{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .activity-meta .pill{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:600;border-radius:9px;padding:1px 8px;margin-right:4px;font-size:10.5px;}
  .activity-result{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;margin-top:10px;font-size:12.5px;}
  .activity-result .result-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700;margin-bottom:2px;}
  .activity-media{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;}
  .activity-media img{max-width:220px;max-height:150px;border-radius:8px;border:1px solid var(--line);object-fit:cover;}
  .activity-media a.file-link{font-size:12px;color:var(--brand);text-decoration:none;background:var(--brand-soft);padding:6px 10px;border-radius:6px;display:inline-block;}

  .season-note{background:var(--accent-soft);color:#8A3A18;border-radius:8px;padding:10px 14px;font-size:12.5px;}
  .empty-note{color:var(--ink-soft);font-size:12.5px;font-style:italic;}

  @media (max-width:600px){
    .glance-strip{grid-template-columns:1fr;}
  }

  @page{
    margin: 0.4in;
  }

  @media print{
    body{background:#fff;}
    .controls, .no-print{display:none !important;}
    .report{border:none;padding:0;box-shadow:none;border-radius:0;}
    .report-header{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .shell{max-width:100%;padding:0;}
  }
</style>
</head>
<body>
<div class="shell">

  <div class="controls no-print">
    <div class="row">
      <div class="field" style="min-width:220px;">
        <label>Hotel</label>
        <select id="hotelSelect"><option value="">Loading...</option></select>
      </div>
      <button class="btn secondary" id="loadBtn">Load data</button>
      <button class="btn" id="printBtn">Print / Export</button>
      <span class="status-text" id="statusText"></span>
    </div>
    <div class="row" style="margin-top:12px;">
      <div class="field">
        <label>Report period</label>
        <select id="periodSelect"></select>
      </div>
      <div class="field">
        <label>Costs</label>
        <div class="toggle-row"><input type="checkbox" id="showSpendToggle" checked> <label for="showSpendToggle" style="text-transform:none;font-weight:400;">Show spend &amp; ROAS</label></div>
      </div>
    </div>
  </div>

  <div id="reportRoot"></div>

</div>

<script>
const SHEETS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxKHZNNI6QlVeyv9Q982-ErEYSXkIdD6vTt0Lpq5z2YMCA_-cR1KROjWjM_p_tzolDSVw/exec";
const el = id => document.getElementById(id);

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error(`Timed out waiting for ${label} (no response after ${ms/1000}s)`)), ms))
  ]);
}
function checkBackendConfigured(){
  if(!SHEETS_WEBAPP_URL || SHEETS_WEBAPP_URL.indexOf("PASTE_YOUR") === 0){
    throw new Error("Backend not configured — paste the same Apps Script URL used in the main workspace into SHEETS_WEBAPP_URL near the top of this file.");
  }
}
async function stGet(key){
  checkBackendConfigured();
  const bust = Date.now() + "_" + Math.random().toString(36).slice(2);
  const res = await withTimeout(
    fetch(`${SHEETS_WEBAPP_URL}?key=${encodeURIComponent(key)}&_=${bust}`, { cache: "no-store" }),
    12000, `loading "${key}"`
  );
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.value;
}

let hotelIndex = [];
let currentHotel = null;
let currentResults = null;
let currentProgress = null;
let primaryPeriodLabel = null;

async function loadHotelIndex(){
  try{ hotelIndex = JSON.parse(await stGet("dmh-hotel-index")); } catch(e){ hotelIndex = []; }
}
function populateHotelSelect(){
  const sel = el("hotelSelect");
  sel.innerHTML = '<option value="">Select a hotel...</option>';
  hotelIndex.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(h=>{
    const opt = document.createElement("option"); opt.value = h.id; opt.textContent = h.name; sel.appendChild(opt);
  });
}

async function loadAllForHotel(id){
  el("statusText").textContent = "Loading...";
  try{
    currentHotel = JSON.parse(await stGet(`dmh-hotel:${id}`));
  } catch(e){ currentHotel = null; }
  try{
    currentResults = JSON.parse(await stGet(`dmh-results:${id}`));
  } catch(e){ currentResults = { periods: [] }; }
  try{
    currentProgress = JSON.parse(await stGet(`dmh-progress:${id}`));
  } catch(e){ currentProgress = { cards: [] }; }
  const periods = sortPeriodsChronologically(currentResults.periods || []);
  primaryPeriodLabel = periods.length ? periods[periods.length-1].period : null;
  el("statusText").textContent = "Loaded " + new Date().toLocaleTimeString('en-US');
  renderPeriodSelect();
  renderReport();
}

function getField(sectionId, key){ return currentHotel?.sections?.[sectionId]?.fields?.[key] || ""; }

function parsePeriodDate(label){
  const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const m = (label||"").trim().match(/^([A-Za-z]{3,9})\.?\s+(\d{4})$/);
  if(!m) return null;
  const key = m[1].slice(0,3).toLowerCase();
  if(!(key in months)) return null;
  return new Date(parseInt(m[2],10), months[key], 1).getTime();
}
function sortPeriodsChronologically(periods){
  return periods.map((p,i)=>({p, i, t: parsePeriodDate(p.period)}))
    .sort((a,b)=>{
      if(a.t===null && b.t===null) return a.i-b.i;
      if(a.t===null) return 1;
      if(b.t===null) return -1;
      return a.t-b.t;
    })
    .map(x=>x.p);
}

function renderPeriodSelect(){
  const sel = el("periodSelect");
  const periods = sortPeriodsChronologically(currentResults?.periods || []);
  if(periods.length === 0){ sel.innerHTML = '<option value="">No periods logged</option>'; return; }
  sel.innerHTML = periods.map(p=>`<option value="${p.period}" ${p.period===primaryPeriodLabel?"selected":""}>${p.period}</option>`).join("");
  sel.onchange = ()=>{ primaryPeriodLabel = sel.value; renderReport(); };
}

function renderReport(){
  const root = el("reportRoot");
  root.innerHTML = "";
  if(!currentHotel){ root.innerHTML = '<div class="empty-note">Select a hotel and click Load data.</div>'; return; }

  // Sort chronologically by parsing "Mon YYYY" labels — periods can be added
  // out of date order (e.g. backfilling an earlier month after a later one
  // already exists), so array/insertion order can't be trusted for
  // "previous period" or trend-window logic. Unparseable labels fall back
  // to the end, in their original relative order, rather than breaking.
  function parsePeriodDate(label){
    const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
    const m = (label||"").trim().match(/^([A-Za-z]{3,9})\.?\s+(\d{4})$/);
    if(!m) return null;
    const key = m[1].slice(0,3).toLowerCase();
    if(!(key in months)) return null;
    return new Date(parseInt(m[2],10), months[key], 1).getTime();
  }
  const rawPeriods = currentResults.periods || [];
  const allPeriods = rawPeriods.map((p,i)=>({p, i, t: parsePeriodDate(p.period)}))
    .sort((a,b)=>{
      if(a.t===null && b.t===null) return a.i-b.i;
      if(a.t===null) return 1;
      if(b.t===null) return -1;
      return a.t-b.t;
    })
    .map(x=>x.p);
  const primaryPeriod = allPeriods.find(p=>p.period===primaryPeriodLabel) || null;
  if(!primaryPeriod){ root.innerHTML = '<div class="empty-note">Select a report period above.</div>'; return; }

  const showSpend = el("showSpendToggle").checked;
  const periodLabel = primaryPeriod.period;
  const allRows = primaryPeriod.rows || [];
  const notesText = [primaryPeriod.seasonalNote].filter(Boolean);

  // Tracked (marketing-attributed) totals for this period — only what's
  // logged against a campaign/channel above.
  const totals = allRows.reduce((acc,r)=>({
    spend: acc.spend+(r.spend||0), traffic: acc.traffic+(r.traffic||0), bookings: acc.bookings+(r.bookings||0), revenue: acc.revenue+(r.revenue||0)
  }), {spend:0,traffic:0,bookings:0,revenue:0});
  const roas = totals.spend>0 ? (totals.revenue/totals.spend).toFixed(2) : "—";

  // Overall hotel results — the whole property, organic + tracked combined,
  // entered separately per period in the main workspace. This is the
  // number that carries the big-picture story: last year had no tracked
  // marketing at all, so a YoY comparison only makes sense against these
  // overall totals, never against tracked-only figures.
  const overallTotals = {
    websiteTraffic: parseFloat(primaryPeriod.totalWebsiteTraffic)||0,
    beTraffic: parseFloat(primaryPeriod.totalBeTraffic)||0,
    bookings: parseFloat(primaryPeriod.totalBookings)||0,
    revenue: parseFloat(primaryPeriod.totalRevenue)||0,
  };
  const hasOverallData = overallTotals.websiteTraffic>0 || overallTotals.beTraffic>0 || overallTotals.bookings>0 || overallTotals.revenue>0;

  // Compare against the period right before the report period.
  const primaryIndex = allPeriods.findIndex(p=>p.period===periodLabel);
  const previousPeriod = primaryIndex > 0 ? allPeriods[primaryIndex-1] : null;
  const prevTotals = previousPeriod ? (previousPeriod.rows||[]).reduce((acc,r)=>({
    spend: acc.spend+(r.spend||0), traffic: acc.traffic+(r.traffic||0), bookings: acc.bookings+(r.bookings||0), revenue: acc.revenue+(r.revenue||0)
  }), {spend:0,traffic:0,bookings:0,revenue:0}) : null;
  const prevOverallTotals = previousPeriod ? {
    websiteTraffic: parseFloat(previousPeriod.totalWebsiteTraffic)||0,
    beTraffic: parseFloat(previousPeriod.totalBeTraffic)||0,
    bookings: parseFloat(previousPeriod.totalBookings)||0,
    revenue: parseFloat(previousPeriod.totalRevenue)||0,
  } : null;
  const hasPrevOverallData = prevOverallTotals && (prevOverallTotals.websiteTraffic>0 || prevOverallTotals.beTraffic>0 || prevOverallTotals.bookings>0 || prevOverallTotals.revenue>0);

  // Trend window for the charts below — last few months up to and
  // including the report period.
  const TREND_WINDOW = 6;
  const trendPeriods = primaryIndex >= 0 ? allPeriods.slice(Math.max(0, primaryIndex-TREND_WINDOW+1), primaryIndex+1) : [];

  function pctDelta(curr, prev){
    if(prev===null || prev===undefined || prev===0) return null;
    return ((curr-prev)/prev*100);
  }
  function deltaBadge(curr, prev, goodWhenUp=true){
    const d = pctDelta(curr, prev);
    if(d === null) return "";
    const up = d >= 0;
    const positive = goodWhenUp ? up : !up;
    const cls = positive ? "delta-up" : "delta-down";
    const arrow = up ? "▲" : "▼";
    return `<span class="delta-badge ${cls}">${arrow} ${Math.abs(d).toFixed(0)}%</span>`;
  }
  // YoY compares OVERALL numbers (this period's total vs the same period a
  // year ago, entered manually from the hotel's own analytics) — never
  // tracked-marketing numbers, since there was no tracking a year ago and
  // that comparison would be meaningless.
  function yoyBadge(curr, manualPrev){
    const prevNum = parseFloat(manualPrev);
    if(isNaN(prevNum)) return "";
    return deltaBadge(curr, prevNum);
  }
  const hasYoyData = ["yoyRevenue","yoyTraffic","yoyBookings"].some(k=>!isNaN(parseFloat(primaryPeriod[k])));

  const report = document.createElement("div");
  report.className = "report";

  report.innerHTML += `
    <div class="report-header">
      <div class="report-kicker">Exely Digital Marketing Hub</div>
      <div class="report-title">${getField("hotelData","name") || currentHotel.id}</div>
      <div class="report-sub">${periodLabel}</div>
    </div>`;
  const bodyWrap = document.createElement("div"); bodyWrap.className = "report-body";
  report.appendChild(bodyWrap);

  // ============================================================
  // LAYER 1 — Overall performance (the big picture, all sources)
  // ============================================================
  const layer1 = document.createElement("div"); layer1.className = "layer-heading"; layer1.textContent = "Overall performance";
  bodyWrap.appendChild(layer1);

  if(!hasOverallData){
    const note = document.createElement("div"); note.className = "empty-note";
    note.textContent = "Overall hotel results (all sources) haven't been filled in for this period yet — add them in the main workspace to unlock this section.";
    bodyWrap.appendChild(note);
  } else {
    // Guard against "this field just isn't filled in yet" reading as a
    // real -100% collapse — only show a comparison when the CURRENT value
    // is actually a real, non-zero figure.
    function momLine(curr, prev){
      if(!curr || !hasPrevOverallData) return "";
      return `<div class="glance-yoy">vs last month: ${deltaBadge(curr, prev)}</div>`;
    }
    function yoyLineSafe(curr, manualPrev){
      if(!curr || !hasYoyData) return "";
      const badge = yoyBadge(curr, manualPrev);
      return badge ? `<div class="glance-yoy">vs last year: ${badge}</div>` : "";
    }
    const glance = document.createElement("div"); glance.className = "glance-strip";
    glance.innerHTML = `
      <div class="glance-item">
        <div class="glance-label">Total revenue</div>
        <div class="glance-val">$${overallTotals.revenue}</div>
        ${momLine(overallTotals.revenue, prevOverallTotals?.revenue)}
        ${yoyLineSafe(overallTotals.revenue, primaryPeriod.yoyRevenue)}
      </div>
      <div class="glance-item">
        <div class="glance-label">Total bookings</div>
        <div class="glance-val">${overallTotals.bookings}</div>
        ${momLine(overallTotals.bookings, prevOverallTotals?.bookings)}
        ${yoyLineSafe(overallTotals.bookings, primaryPeriod.yoyBookings)}
      </div>
      <div class="glance-item">
        <div class="glance-label">Total website traffic</div>
        <div class="glance-val">${overallTotals.websiteTraffic}</div>
        ${momLine(overallTotals.websiteTraffic, prevOverallTotals?.websiteTraffic)}
      </div>
      <div class="glance-item">
        <div class="glance-label">Total Booking Engine traffic</div>
        <div class="glance-val">${overallTotals.beTraffic}</div>
        ${momLine(overallTotals.beTraffic, prevOverallTotals?.beTraffic)}
        ${yoyLineSafe(overallTotals.beTraffic, primaryPeriod.yoyTraffic)}
      </div>
    `;
    bodyWrap.appendChild(glance);
    if(!hasPrevOverallData && !hasYoyData){
      const note = document.createElement("div"); note.className = "empty-note"; note.style.textAlign = "center"; note.style.margin = "10px 0 4px";
      note.textContent = "No prior period or year-over-year reference yet — comparisons will appear once logged.";
      bodyWrap.appendChild(note);
    }
  }

  // ============================================================
  // LAYER 2 — Marketing contribution (what tracked activity did)
  // ============================================================
  const layer2 = document.createElement("div"); layer2.className = "layer-heading"; layer2.textContent = "Marketing contribution";
  bodyWrap.appendChild(layer2);

  // Activities count needed here too (for Marketing lift context is not
  // required, kept below in Layer 3).
  const doneCards = (currentProgress.cards||[]).filter(c=>
    c.period===periodLabel && (c.stage==="Done/Paused" || c.stage==="Live")
  );
  const completedCount = doneCards.filter(c=>c.stage==="Done/Paused").length;
  const ongoingCount = doneCards.filter(c=>c.stage==="Live").length;
  const prevActivitiesCount = previousPeriod
    ? (currentProgress.cards||[]).filter(c=> c.period===previousPeriod.period && (c.stage==="Done/Paused" || c.stage==="Live")).length
    : null;

  // Marketing lift — tracked vs. total, three rows (bookings, traffic,
  // revenue), one compact table instead of a wall of tiles.
  if(hasOverallData){
    const bookingShare = overallTotals.bookings>0 ? Math.round(totals.bookings/overallTotals.bookings*100) : null;
    const trafficShare = overallTotals.beTraffic>0 ? Math.round(totals.traffic/overallTotals.beTraffic*100) : null;
    const revenueShare = overallTotals.revenue>0 ? Math.round(totals.revenue/overallTotals.revenue*100) : null;
    const liftSection = document.createElement("div"); liftSection.className = "section";
    liftSection.innerHTML = `<div class="section-title">Marketing lift</div>`;
    const liftTable = document.createElement("table"); liftTable.className = "rtable";
    liftTable.innerHTML = `<tr><th></th><th>Total (all sources)</th><th>Tracked marketing</th><th>Share</th></tr>
      <tr><td>Revenue</td><td>$${overallTotals.revenue}</td><td>$${totals.revenue}</td><td><strong>${revenueShare===null?"—":revenueShare+"%"}</strong></td></tr>
      <tr><td>Bookings</td><td>${overallTotals.bookings}</td><td>${totals.bookings}</td><td><strong>${bookingShare===null?"—":bookingShare+"%"}</strong></td></tr>
      <tr><td>Traffic</td><td>${overallTotals.beTraffic}</td><td>${totals.traffic}</td><td><strong>${trafficShare===null?"—":trafficShare+"%"}</strong></td></tr>`;
    liftSection.appendChild(liftTable);
    bodyWrap.appendChild(liftSection);
  }

  // Investment & return — the overall tracked-marketing picture (spend,
  // revenue, bookings, ROAS), before drilling into individual campaigns
  // below. Month-over-month only — no YoY, since tracking didn't exist a
  // year ago and there's nothing honest to compare it against.
  if(showSpend){
    const investSection = document.createElement("div"); investSection.className = "section";
    investSection.innerHTML = `<div class="section-title">Investment &amp; return</div>`;
    const grid = document.createElement("div"); grid.className = "kpi-grid";
    grid.innerHTML = `
      <div class="kpi"><div class="kpi-label">Budget spent</div><div class="kpi-val">$${totals.spend} ${deltaBadge(totals.spend, prevTotals?.spend, false)}</div></div>
      <div class="kpi"><div class="kpi-label">Tracked bookings</div><div class="kpi-val">${totals.bookings} ${deltaBadge(totals.bookings, prevTotals?.bookings)}</div></div>
      <div class="kpi"><div class="kpi-label">Tracked revenue</div><div class="kpi-val accent">$${totals.revenue} ${deltaBadge(totals.revenue, prevTotals?.revenue)}</div></div>
      <div class="kpi"><div class="kpi-label">ROAS</div><div class="kpi-val accent">${roas}×</div></div>
    `;
    investSection.appendChild(grid);
    bodyWrap.appendChild(investSection);
  }

  // Campaign performance — the only place campaign-level numbers live.
  const resultsSection = document.createElement("div"); resultsSection.className = "section";
  resultsSection.innerHTML = `<div class="section-title">Campaign performance</div>`;
  if(allRows.length){
    const byCampaign = {};
    allRows.forEach(r=>{
      const name = r.campaign && r.campaign.trim() ? r.campaign.trim() : (r.channel && r.channel.trim() ? r.channel.trim() : "Other");
      if(!byCampaign[name]) byCampaign[name] = {traffic:0,bookings:0,revenue:0,spend:0,channel:r.channel||""};
      byCampaign[name].traffic += r.traffic||0; byCampaign[name].bookings += r.bookings||0;
      byCampaign[name].revenue += r.revenue||0; byCampaign[name].spend += r.spend||0;
    });
    const table = document.createElement("table"); table.className = "rtable";
    table.innerHTML = `<tr><th>Campaign</th><th>Traffic</th><th>Bookings</th><th>Revenue</th><th>% of Revenue</th>${showSpend?"<th>Spend</th><th>ROAS</th>":""}</tr>` +
      Object.keys(byCampaign).sort((a,b)=>byCampaign[b].revenue-byCampaign[a].revenue).map(name=>{
        const c = byCampaign[name];
        const r = c.spend>0 ? (c.revenue/c.spend).toFixed(2)+"×" : "—";
        const revShare = totals.revenue>0 ? Math.round(c.revenue/totals.revenue*100)+"%" : "—";
        const channelNote = c.channel ? `<div style="font-size:10.5px;color:var(--ink-soft);">${c.channel}</div>` : "";
        return `<tr><td>${name}${channelNote}</td><td>${c.traffic}</td><td>${c.bookings}</td><td>$${c.revenue}</td><td>${revShare}</td>${showSpend?`<td>$${c.spend}</td><td>${r}</td>`:""}</tr>`;
      }).join("");
    resultsSection.appendChild(table);
  } else {
    resultsSection.innerHTML += `<div class="empty-note">No tracked campaigns logged for this period.</div>`;
  }
  bodyWrap.appendChild(resultsSection);

  // Visibility — one line per source/metric, plotted across the trend
  // window. A metric with even a single logged value is drawn from a zero
  // baseline — absence in earlier months usually means "wasn't happening
  // yet," which is a real zero, not missing data. Only genuinely
  // non-numeric entries fall back to a plain list.
  function parseNumeric(str){
    if(str===null || str===undefined) return null;
    const cleaned = String(str).replace(/[^0-9.\-]/g,"");
    if(cleaned==="" || cleaned==="-") return null;
    const n = parseFloat(cleaned);
    return isNaN(n) ? null : n;
  }
  if(trendPeriods.length){
    const trendPeriodLabels = trendPeriods.map(p=>p.period);
    const metricNames = new Set();
    trendPeriods.forEach(p=>(p.visibilityMetrics||[]).forEach(m=>{ if(m.name && m.name.trim()) metricNames.add(m.name.trim()); }));
    const seriesMap = {};
    const plainMetrics = [];
    metricNames.forEach(name=>{
      const values = trendPeriods.map(p=>{
        const found = (p.visibilityMetrics||[]).find(m=>m.name && m.name.trim()===name);
        return found ? parseNumeric(found.value) : null;
      });
      const hasAnyNumeric = values.some(v=>v!==null);
      if(hasAnyNumeric){
        seriesMap[name] = values.map(v=>v===null?0:v);
      } else {
        for(let i=trendPeriods.length-1; i>=0; i--){
          const found = (trendPeriods[i].visibilityMetrics||[]).find(m=>m.name && m.name.trim()===name);
          if(found){ plainMetrics.push(found); break; }
        }
      }
    });
    if(Object.keys(seriesMap).length || plainMetrics.length){
      const visSection = document.createElement("div"); visSection.className = "section";
      visSection.innerHTML = `<div class="section-title">Visibility</div>`;
      const hasTrend = Object.keys(seriesMap).length > 0;
      if(hasTrend){
        const trendLabel = document.createElement("div"); trendLabel.className = "group-sublabel"; trendLabel.textContent = "Trend";
        visSection.appendChild(trendLabel);
        visSection.appendChild(buildLineChart(seriesMap, trendPeriodLabels));
      }
      if(plainMetrics.length){
        if(hasTrend){
          const otherLabel = document.createElement("div"); otherLabel.className = "group-sublabel"; otherLabel.textContent = "Non-numeric signals";
          visSection.appendChild(otherLabel);
        }
        const table = document.createElement("table"); table.className = "rtable";
        table.innerHTML = `<tr><th>Signal</th><th>This period</th></tr>` +
          plainMetrics.map(m=>`<tr><td>${m.name||""}</td><td>${m.value||""}</td></tr>`).join("");
        table.style.marginTop = hasTrend ? "6px" : "0";
        visSection.appendChild(table);
      }
      bodyWrap.appendChild(visSection);
    }
  }

  // ============================================================
  // LAYER 3 — What we did, and what's next
  // ============================================================
  const layer3 = document.createElement("div"); layer3.className = "layer-heading"; layer3.textContent = "What we did, and what's next";
  bodyWrap.appendChild(layer3);

  const activitySection = document.createElement("div"); activitySection.className = "section";
  activitySection.innerHTML = `<div class="section-title">Activities</div>`;
  if(doneCards.length){
    doneCards.forEach(c=>{
      const item = document.createElement("div"); item.className = "activity-card";
      const tagPills = (c.tags||[]).map(t=>`<span class="pill">${t}</span>`).join("");
      item.innerHTML = `
        <div class="activity-title">${c.title||"(untitled)"}</div>
        <div class="activity-meta">${tagPills} ${c.period?("· "+c.period):""} ${c.stage==="Live"?"· ongoing":"· completed"}</div>
        ${c.notes ? `<div class="activity-result"><div class="result-label">Result</div>${c.notes}</div>` : ""}
      `;
      const linkedSubtasks = (c.subtasks||[]).filter(s=>s.link && s.link.trim());
      if(linkedSubtasks.length){
        const media = document.createElement("div"); media.className = "activity-media";
        linkedSubtasks.forEach(s=>{
          if(isImageUrl(s.link)){
            const img = document.createElement("img"); img.src = s.link; img.alt = s.text || "attachment";
            media.appendChild(img);
          } else {
            const a = document.createElement("a"); a.className = "file-link"; a.href = s.link; a.target = "_blank"; a.textContent = "🔗 " + (s.text || "View");
            media.appendChild(a);
          }
        });
        item.appendChild(media);
      }
      activitySection.appendChild(item);
    });
  } else {
    activitySection.innerHTML += `<div class="empty-note">No activities logged for this period yet.</div>`;
  }
  bodyWrap.appendChild(activitySection);

  const plannedCards = (currentProgress.cards||[]).filter(c=> c.stage==="Planned");
  const plannedSection = document.createElement("div"); plannedSection.className = "section";
  plannedSection.innerHTML = `<div class="section-title">Activities planned</div>`;
  if(plannedCards.length){
    plannedCards.forEach(c=>{
      const item = document.createElement("div"); item.className = "activity-card";
      const tagPills = (c.tags||[]).map(t=>`<span class="pill">${t}</span>`).join("");
      item.innerHTML = `
        <div class="activity-title">${c.title||"(untitled)"}</div>
        <div class="activity-meta">${tagPills} ${c.period?("· targeting "+c.period):""}</div>
        ${c.notes ? `<div class="activity-result"><div class="result-label">Plan</div>${c.notes}</div>` : ""}
      `;
      plannedSection.appendChild(item);
    });
  } else {
    plannedSection.innerHTML += `<div class="empty-note">No planned activities logged yet.</div>`;
  }
  bodyWrap.appendChild(plannedSection);

  const generalNotes = (currentProgress.generalNotes || []).filter(n=>n.link && n.link.trim());
  if(generalNotes.length){
    const materialsSection = document.createElement("div"); materialsSection.className = "section";
    materialsSection.innerHTML = `<div class="section-title">Supporting materials</div>`;
    const media = document.createElement("div"); media.className = "activity-media";
    generalNotes.forEach(n=>{
      if(isImageUrl(n.link)){
        const img = document.createElement("img"); img.src = n.link; img.alt = n.note || "attachment";
        media.appendChild(img);
      } else {
        const a = document.createElement("a"); a.className = "file-link"; a.href = n.link; a.target = "_blank"; a.textContent = "🔗 " + (n.note || "View");
        media.appendChild(a);
      }
    });
    materialsSection.appendChild(media);
    bodyWrap.appendChild(materialsSection);
  }

  if(notesText.length){
    const notesSection = document.createElement("div"); notesSection.className = "section";
    notesSection.innerHTML = `<div class="section-title">Notes</div>` +
      notesText.map(n=>`<div class="season-note" style="margin-bottom:8px;">${n}</div>`).join("");
    bodyWrap.appendChild(notesSection);
  }

  root.appendChild(report);
}

function buildLineChart(seriesMap, periodLabels){
  const wrap = document.createElement("div");
  const width = 640, height = 260, padL = 44, padR = 50, padT = 16, padB = 34;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const allValues = Object.values(seriesMap).flat().filter(v=>v!==null && v!==undefined);
  const maxVal = Math.max(...allValues, 1);
  const n = periodLabels.length;
  const xStep = n > 1 ? plotW / (n - 1) : 0;
  const colors = ["#4D1774", "#F65925", "#2E5FA3", "#1D9E75", "#993556", "#A9791B"];

  let svg = `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;" role="img" aria-label="Visibility trend by source">`;
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${height-padB}" stroke="var(--line)" stroke-width="1"/>`;
  svg += `<line x1="${padL}" y1="${height-padB}" x2="${width-padR}" y2="${height-padB}" stroke="var(--line)" stroke-width="1"/>`;
  periodLabels.forEach((label,i)=>{
    const x = padL + i*xStep;
    svg += `<text x="${x}" y="${height-padB+18}" font-size="10.5" text-anchor="middle" fill="var(--ink-soft)">${label}</text>`;
  });
  [0, 0.5, 1].forEach(frac=>{
    const y = padT + plotH - frac*plotH;
    const val = Math.round(frac*maxVal);
    svg += `<text x="${padL-8}" y="${y+3}" font-size="10" text-anchor="end" fill="var(--ink-soft)">${val}</text>`;
  });

  const legendItems = [];
  let colorIdx = 0;
  Object.keys(seriesMap).forEach(name=>{
    const color = colors[colorIdx % colors.length]; colorIdx++;
    legendItems.push({name, color});
    const values = seriesMap[name];
    const points = [];
    values.forEach((v,i)=>{
      if(v===null || v===undefined) return;
      const x = padL + i*xStep;
      const y = padT + plotH - (v/maxVal*plotH);
      points.push([x,y,v]);
    });
    if(points.length){
      const path = points.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
      svg += `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
      points.forEach(p=>{ svg += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${color}"/>`; });
      // Label the most recent point with its exact figure, plus the %
      // change from the first point in the window — labeling every point
      // gets cluttered once there are several months and series; the
      // gridlines on the left give a rough read on the rest.
      const first = points[0];
      const last = points[points.length-1];
      let pctText = "";
      if(points.length > 1){
        if(first[2] === 0){
          pctText = last[2] > 0 ? " (new)" : "";
        } else {
          const pct = Math.round((last[2]-first[2])/first[2]*100);
          pctText = ` (${pct>=0?"▲":"▼"}${Math.abs(pct)}%)`;
        }
      }
      svg += `<text x="${(last[0]+4).toFixed(1)}" y="${(last[1]-9).toFixed(1)}" font-size="10.5" text-anchor="start" fill="${color}" font-weight="600">${Math.round(last[2])}${pctText}</text>`;
    }
  });
  svg += `</svg>`;

  const legendHtml = legendItems.map(li=>
    `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:16px;font-size:11.5px;color:var(--ink-soft);"><span style="width:9px;height:9px;border-radius:50%;background:${li.color};display:inline-block;"></span>${li.name}</span>`
  ).join("");

  wrap.innerHTML = `<div style="margin-bottom:10px;">${legendHtml}</div>`;
  wrap.innerHTML += svg;
  return wrap;
}

function buildComparisonChart(metrics, prevLabel, currLabel, title){
  const wrap = document.createElement("div"); wrap.className = "section compare-chart";
  wrap.innerHTML = `<div class="section-title">${title || "What changed vs last time"}</div>
    <div class="compare-legend">
      <span><span class="legend-dot" style="background:var(--line);"></span>${prevLabel}</span>
      <span><span class="legend-dot" style="background:var(--brand);"></span>${currLabel}</span>
    </div>`;
  metrics.forEach(m=>{
    const max = Math.max(m.curr, m.prev, 1);
    const row = document.createElement("div"); row.className = "compare-row";
    const pct = m.prev>0 ? Math.round((m.curr-m.prev)/m.prev*100) : null;
    row.innerHTML = `
      <div>${m.label}</div>
      <div class="compare-bars">
        <div class="compare-bar-track"><div class="compare-bar-fill prev" style="width:${(m.prev/max*100).toFixed(0)}%;"></div></div>
        <div class="compare-bar-track"><div class="compare-bar-fill curr" style="width:${(m.curr/max*100).toFixed(0)}%;"></div></div>
      </div>
      <div style="text-align:right;font-weight:600;color:${pct===null?'var(--ink-soft)':pct>=0?'#8A3A18':'var(--ink-soft)'};">${pct===null?"—":(pct>=0?"+":"")+pct+"%"}</div>
    `;
    wrap.appendChild(row);
  });
  return wrap;
}

function isImageUrl(url){
  return /\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(url.trim());
}

el("loadBtn").addEventListener("click", ()=>{
  const id = el("hotelSelect").value;
  if(!id) return;
  loadAllForHotel(id);
});
el("showSpendToggle").addEventListener("change", renderReport);
el("printBtn").addEventListener("click", ()=> window.print());

(async function init(){
  el("statusText").textContent = "Loading hotel list...";
  try{ await loadHotelIndex(); populateHotelSelect(); el("statusText").textContent = ""; }
  catch(e){ el("statusText").textContent = "⚠ " + e.message; }
})();
</script>
